<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Desk · Cross Core OPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161310; --ink-2:#221E18; --ink-3:#2E2820;
  --paper:#F8F6F0; --card:#FFFFFF; --line:#E8E2D4; --line-soft:#F0EBDF;
  --gold:#F2B90D; --gold-deep:#DE9200; --gold-soft:#FBF3DA;
  --muted:#8B8374; --body:#3D3830;
  --green:#1F8A5B; --green-soft:#E4F3EC;
  --blue:#2563EB; --blue-soft:#E8EEFC;
  --amber:#C97E00; --amber-soft:#FCF0D8;
  --red:#C2410C; --red-soft:#FBEAE1;
  --gray:#857D6F; --gray-soft:#EFECE4;
  --danger:#B3261E;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(22,19,16,.05),0 8px 28px -12px rgba(22,19,16,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Archivo',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:inherit}
::selection{background:var(--gold);color:var(--ink)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(140deg,#161310 0%,#221B0E 55%,#3A2A08 100%);position:relative;overflow:hidden}
.login-wrap::after{content:"";position:absolute;inset:auto -20% -55% -20%;height:70%;
  background:radial-gradient(ellipse at center,rgba(242,185,13,.22),transparent 65%)}
.login-card{position:relative;z-index:1;width:100%;max-width:430px;background:var(--card);border-radius:20px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden}
.login-band{height:6px;background:linear-gradient(90deg,var(--gold-deep),var(--gold) 60%,#FFD75E)}
.login-inner{padding:36px 36px 30px}
.brand-row{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{display:block}
.brand-name{font-family:'Archivo';font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--ink)}
.brand-sub{font-size:10.5px;letter-spacing:.22em;color:var(--muted);font-weight:600}
.login-inner h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.login-inner .lede{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.role-grid{display:grid;gap:9px;margin-bottom:18px}
.role-opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:.15s}
.role-opt:hover{border-color:#CFC7B2}
.role-opt.sel{border-color:var(--gold-deep);background:var(--gold-soft)}
.role-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:.15s}
.role-opt.sel .role-dot{background:var(--gold-deep)}
.role-opt b{display:block;font-size:13.5px;color:var(--ink)}
.role-opt span{font-size:12px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(222,146,0,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;transition:.15s}
.btn-gold{background:var(--gold);color:var(--ink);width:100%}
.btn-gold:hover{background:#E8AF06}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-3)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#CFC7B2}
.btn-danger{background:var(--red-soft);color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.login-err{color:var(--danger);font-size:12.5px;margin:-6px 0 12px;display:none}
.login-note{margin-top:18px;padding:11px 13px;background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;font-size:12px;color:var(--muted)}
.login-note code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:232px;flex:none;background:var(--ink);color:#B7AFA0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.side-brand .brand-name{color:#fff;font-size:13px}
.side-brand .brand-sub{color:#8F8776}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.2em;color:#6E675A;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:transparent;border:none;color:#B7AFA0;font-size:13px;font-weight:500;text-align:left;width:100%;position:relative;transition:.13s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:rgba(242,185,13,.13);color:var(--gold)}
.nav-item.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item .cnt{margin-left:auto;font-size:11px;color:#7C7466;font-variant-numeric:tabular-nums}
.nav-item.on .cnt{color:var(--gold-deep)}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:12px}
.side-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.side-user b{color:#fff;display:block;font-size:12.5px}
.side-user span{color:#8F8776;font-size:11px}
.signout{background:none;border:none;color:#8F8776;font-size:12px;padding:0;text-decoration:underline}
.signout:hover{color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:5px;background:linear-gradient(90deg,var(--gold-deep),var(--gold) 55%,#FFD75E)}
.page{padding:30px 38px 60px;max-width:1160px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.015em}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- cards & kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi .k-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font-family:'Archivo';font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .k-note{font-size:11.5px;color:var(--muted);margin-top:2px}

.list-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.lc{padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.15s}
.lc:hover{border-color:#D8CFBB;transform:translateY(-1px)}
.lc-top{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.lc-title b{font-family:'Archivo';font-size:15.5px;color:var(--ink);display:block;letter-spacing:-.01em}
.lc-title span{font-size:12px;color:var(--muted)}
.lc-week{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.bar{height:6px;border-radius:4px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}

/* status colors */
.st-NOT_CONNECTED{background:var(--gray-soft);color:var(--gray)}
.st-REQUEST_SENT{background:var(--amber-soft);color:var(--amber)}
.st-CONNECTED{background:var(--green-soft);color:var(--green)}
.st-RESPONDED{background:var(--blue-soft);color:var(--blue)}
.st-FOLLOW_UP{background:var(--red-soft);color:var(--red)}

/* ---------- table ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=text],.toolbar input[type=date],.toolbar select{padding:8.5px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;outline:none}
.toolbar input[type=text]{min-width:220px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold-deep)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFAF5}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FCFAF4}
td .p-name{font-weight:600;color:var(--ink)}
td .p-pos{font-size:11.5px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.link-btn{font-size:12px;color:var(--gold-deep);font-weight:600;text-decoration:none;border-bottom:1px solid transparent}
.link-btn:hover{border-color:var(--gold-deep)}
.st-select{border:1.5px solid transparent;border-radius:20px;font-size:11.5px;font-weight:600;padding:4px 8px;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s}
.icon-btn:hover{color:var(--ink);border-color:#CFC7B2}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.empty{padding:44px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:'Archivo';font-size:15px;margin-bottom:4px}
.count-note{font-size:12px;color:var(--muted);margin:10px 2px 0}
.badge-arch{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--gray-soft);border-radius:4px;padding:2px 6px;margin-left:6px}

/* target strip on list page */
.target-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ts-card{flex:1;min-width:200px;padding:15px 18px;display:flex;align-items:center;gap:14px}
.ts-card .t-num{font-family:'Archivo';font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ts-card .t-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ts-card .t-sub{font-size:11.5px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,19,16,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);overflow:hidden}
.modal-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:17px;font-weight:700}
.modal-body{padding:18px 24px 24px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:0 24px 22px}
.close-x{background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.form-err{color:var(--danger);font-size:12.5px;margin-bottom:12px;display:none}

/* ---------- activity ---------- */
.act-row td:first-child{white-space:nowrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.act-chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2.5px 8px;border-radius:5px;text-transform:uppercase}
.ac-add{background:var(--green-soft);color:var(--green)}
.ac-status{background:var(--blue-soft);color:var(--blue)}
.ac-edit{background:var(--amber-soft);color:var(--amber)}
.ac-archive,.ac-delete{background:var(--gray-soft);color:var(--gray)}
.ac-list,.ac-access,.ac-import{background:var(--gold-soft);color:var(--gold-deep)}

/* ---------- integration ---------- */
.int-status{display:flex;align-items:center;gap:14px;padding:20px 22px;margin-bottom:16px}
.int-dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(242,185,13,.18);flex:none}
.int-status b{font-family:'Archivo';font-size:15px;color:var(--ink);display:block}
.int-status span{font-size:12.5px;color:var(--muted)}
.int-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.int-card{padding:20px 22px}
.int-card h3{font-size:14px;margin-bottom:8px}
.int-card p{font-size:12.8px;color:var(--body);margin-bottom:10px}
.int-card ul{margin:0 0 12px 17px;font-size:12.8px;color:var(--body)}
.int-card li{margin-bottom:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-bottom:10px}
.tag-ok{background:var(--green-soft);color:var(--green)}
.tag-wait{background:var(--gray-soft);color:var(--gray)}
.note-box{margin-top:16px;padding:14px 16px;background:var(--gold-soft);border:1px solid #EED9A0;border-radius:10px;font-size:12.5px;color:#6B5205}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--gold)}

/* section titles */
.sec-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}

@media (max-width:900px){
  .shell.on{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap}
  .nav{flex-direction:row;flex-wrap:wrap;padding:8px}
  .nav-label{display:none}
  .nav-item.on::before{display:none}
  .side-foot{border-top:none;margin-left:auto}
  .page{padding:20px 16px 60px}
  .int-grid{grid-template-columns:1fr}
  .modal .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}
</style>
</head>

    <div class="login-band"></div>

          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 1.5L12.2 7.8L18.5 10L12.2 12.2L10 18.5L7.8 12.2L1.5 10L7.8 7.8L10 1.5Z" fill="#F2B90D"/></svg>

<!-- ============ APP SHELL ============ -->
<div class="shell" id="appShell">

      <div><div class="brand-name">CROSS CORE</div><div class="brand-sub">PROSPECT DESK</div></div>
    </div>
    <nav class="nav" id="sideNav"></nav>
    <div class="side-foot">
      <div class="side-user"><div class="avatar" id="userAvatar">A</div><div><b id="userName">—</b><span id="userRole">—</span></div></div>
      <button class="signout" id="signOut">Switch portal</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"></div>
    <div class="page" id="pageRoot"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

const fmtDT = ts => new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
const dayKey = ts => { const d=new Date(ts); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const todayKey = () => dayKey(Date.now());
function weekStart(){ const d=new Date(); const dow=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-dow); return d.getTime(); }

async function persist(){
  if(memoryOnly) return;
  try{ await window.storage.set(KEY, JSON.stringify(S)); }
  catch(e){ memoryOnly = true; }
}
async function loadState(){
  try{
    const r = await window.storage.get(KEY);
    if(r && r.value) return JSON.parse(r.value);
  }catch(e){ /* first run or storage unavailable */ }
  return null;
}

/* ================= HELPERS ================= */
const listById = id => S.lists.find(l=>l.id===id);
const activeLists = () => S.lists.filter(l=>!l.archived);
const listProspects = (id, includeArchived=false) => S.prospects.filter(p=>p.listId===id && (includeArchived||!p.archived));
function addActivity(action, detail){
  S.activity.unshift({id:uid(), ts:Date.now(), user:session?session.name:'System', action, detail});
  if(S.activity.length>800) S.activity.length = 800;
}
function toast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = msg;
  t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('on'), 2600);
}
const can = perm => {
  if(!session) return false;
  if(session.role==='admin') return true;
  if(session.role==='member') return ['add','status','edit','archive'].includes(perm);
  return false;
};

function countToday(listId){ const k=todayKey(); return listProspects(listId).filter(p=>dayKey(p.addedAt)===k).length; }
function countWeek(listId){ const ws=weekStart(); return listProspects(listId).filter(p=>p.addedAt>=ws).length; }
function statusCounts(listId){
  const c = {}; Object.keys(STATUSES).forEach(k=>c[k]=0);
  listProspects(listId).forEach(p=>c[p.status]!==undefined && c[p.status]++);
  return c;
}

function ring(done, target, size=64){
  const r=(size/2)-5, circ=2*Math.PI*r, pct=Math.min(done/target,1);
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${done} of ${target} today">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--gray-soft)" stroke-width="6"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${pct>=1?'var(--green)':'var(--gold-deep)'}" stroke-width="6"
      stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pct)}" transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="46%" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="${size*0.26}" fill="var(--ink)">${done}</text>
    <text x="50%" y="66%" text-anchor="middle" font-family="Inter" font-weight="600" font-size="${size*0.14}" fill="var(--muted)">of ${target}</text>
  </svg>`;
}

  const remaining = Math.max(l.dailyTarget - today, 0);

  const icps = [...new Set(S.prospects.filter(p=>p.listId===listId).map(p=>p.icp).filter(Boolean))].sort();

  let rows = S.prospects.filter(p=>p.listId===listId && (f.arch ? true : !p.archived));
  if(f.q){ const q=f.q.toLowerCase(); rows = rows.filter(p=>(p.name+' '+p.company+' '+p.position).toLowerCase().includes(q)); }
  if(f.status) rows = rows.filter(p=>p.status===f.status);

  if(f.from) rows = rows.filter(p=>dayKey(p.addedAt) >= f.from);

      </div></td>

      <p style="color:var(--muted);font-size:12px">For Dan Soviero — monitoring without any risk of accidental edits.</p></div>
  </div>
  <div class="note-box" style="margin-top:16px">Currently signed in via the <b>${session.portal==='team'?'CrossCore VA':'Client Portal'}</b> entrance. Use "Switch portal" in the sidebar to change. For a production deployment with real accounts and server-enforced permissions, this same interface can be connected to a hosted backend — the layout and workflow stay identical.</div>`;
}

/* ================= MODALS ================= */
function openModal(html){ document.getElementById('modalBox').innerHTML = html; document.getElementById('overlay').classList.add('on'); }
function closeModal(){ document.getElementById('overlay').classList.remove('on'); }

function prospectModal(listId, prospect){
  const isEdit = !!prospect;
  const l = listById(listId);
  const p = prospect || {name:'',position:'',company:'',icp:l.icp,url:'',status:'NOT_CONNECTED',note:''};
  openModal(`
  <div class="modal-head"><h2>${isEdit?'Edit prospect':'Add prospect'} · ${esc(l.name)}</h2><button class="close-x" data-close>×</button></div>
  <div class="modal-body">
    <p class="form-err" id="pErr"></p>
    <div class="field"><label>Full name *</label><input id="pName" type="text" value="${esc(p.name)}" placeholder="e.g. Jordan Reyes"></div>
    <div class="grid2">
      <div class="field"><label>Position</label><input id="pPos" type="text" value="${esc(p.position)}" placeholder="e.g. Managing Partner"></div>
      <div class="field"><label>Company</label><input id="pComp" type="text" value="${esc(p.company)}" placeholder="e.g. Summit Capital"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>ICP category *</label><input id="pIcp" type="text" value="${esc(p.icp)}" placeholder="e.g. Angel Investors"></div>
      <div class="field"><label>Status</label><select id="pStatus">${Object.keys(STATUSES).map(k=>`<option value="${k}" ${k===p.status?'selected':''}>${STATUSES[k]}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>LinkedIn profile URL</label><input id="pUrl" type="url" value="${esc(p.url)}" placeholder="https://www.linkedin.com/in/…"></div>
    <div class="field"><label>Notes</label><textarea id="pNote" rows="2" placeholder="Optional context, e.g. warm intro via…">${esc(p.note)}</textarea></div>
  </div>
  <div class="modal-foot"><button class="btn btn-ghost btn-sm" data-close>Cancel</button>
    <button class="btn btn-gold btn-sm" style="width:auto" id="pSave" data-list="${listId}" data-pid="${isEdit?p.id:''}">${isEdit?'Save changes':'Add prospect'}</button></div>`);
}

function listModal(list){
  const isEdit = !!list;
  const l = list || {name:'', icp:'', dailyTarget:15};
  openModal(`
  <div class="modal-head"><h2>${isEdit?'List settings':'New prospect list'}</h2><button class="close-x" data-close>×</button></div>
  <div class="modal-body">
    <p class="form-err" id="lErr"></p>
    <div class="field"><label>List name *</label><input id="lName" type="text" value="${esc(l.name)}" placeholder="e.g. Family Offices — Tier 1"></div>
    <div class="field"><label>ICP category *</label><input id="lIcp" type="text" value="${esc(l.icp)}" placeholder="e.g. Family Office Principals"></div>
    <div class="field"><label>Daily target (qualified prospects)</label><input id="lTarget" type="number" min="1" max="200" value="${l.dailyTarget}"></div>
  </div>
  <div class="modal-foot">
    ${isEdit?`<button class="btn btn-danger btn-sm" id="lArchive" data-lid="${l.id}" style="margin-right:auto">${l.archived?'Restore list':'Archive list'}</button>`:''}
    <button class="btn btn-ghost btn-sm" data-close>Cancel</button>
    <button class="btn btn-gold btn-sm" style="width:auto" id="lSave" data-lid="${isEdit?l.id:''}">${isEdit?'Save':'Create list'}</button></div>`);
}

/* ================= RENDER ================= */
function render(){
  renderNav();
  const root = document.getElementById('pageRoot');
  if(view==='dashboard') root.innerHTML = renderDashboard();
  else if(view.startsWith('list:')) root.innerHTML = renderList(view.slice(5));
  else if(view==='activity') root.innerHTML = renderActivity();
  else if(view==='integration') root.innerHTML = renderIntegration();
  else if(view==='access') root.innerHTML = renderAccess();
}

/* ================= ACTIONS ================= */
function findDuplicate(url, name, excludeId){
  const c = canon(url);
  return S.prospects.find(p=>{
    if(p.id===excludeId || p.archived) return false;
    if(c && canon(p.url)===c) return true;
    if(!c && p.name.trim().toLowerCase()===name.trim().toLowerCase()) return true;
    return false;
  });
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav],[data-open-list],[data-addto],[data-edit],[data-archive],[data-del],[data-editlist],[data-close],[data-digest],#pSave,#lSave,#lArchive');
  if(!t) return;

  if(t.dataset.digest!==undefined){ digestModal(); return; }

  if(t.dataset.close!==undefined){ closeModal(); return; }

  if(t.dataset.nav){
    if(t.dataset.nav==='newlist'){ if(can('lists')) listModal(null); return; }
    view = t.dataset.nav; render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.openList){ view='list:'+t.dataset.openList; render(); window.scrollTo(0,0); return; }
  if(t.dataset.addto){ prospectModal(t.dataset.addto, null); return; }
  if(t.dataset.edit){ const p=S.prospects.find(x=>x.id===t.dataset.edit); if(p) prospectModal(p.listId, p); return; }
  if(t.dataset.editlist){ listModal(listById(t.dataset.editlist)); return; }

  if(t.dataset.archive){
    const p=S.prospects.find(x=>x.id===t.dataset.archive); if(!p) return;
    p.archived=!p.archived; p.updatedAt=Date.now();
    addActivity('archive', `${p.archived?'Archived':'Restored'} ${p.name} in ${listById(p.listId).name}`);
    persist(); render(); toast(p.archived?`<b>${esc(p.name)}</b> archived`:`<b>${esc(p.name)}</b> restored`); return;
  }
  if(t.dataset.del){
    const p=S.prospects.find(x=>x.id===t.dataset.del); if(!p) return;
    if(!confirm(`Permanently delete ${p.name}? This cannot be undone.`)) return;
    S.prospects = S.prospects.filter(x=>x.id!==p.id);
    addActivity('delete', `Deleted ${p.name} from ${listById(p.listId).name}`);
    persist(); render(); toast(`<b>${esc(p.name)}</b> deleted`); return;
  }

  if(t.id==='pSave'){
    const err=document.getElementById('pErr');
    const name=document.getElementById('pName').value.trim();
    const icp=document.getElementById('pIcp').value.trim();
    const url=document.getElementById('pUrl').value.trim();
    if(!name||!icp){ err.textContent='Name and ICP category are required.'; err.style.display='block'; return; }
    if(url && !/^https?:\/\/([a-z]+\.)?linkedin\.com\//i.test(url)){ err.textContent='LinkedIn URL should start with https://www.linkedin.com/…'; err.style.display='block'; return; }
    const pid=t.dataset.pid, listId=t.dataset.list;
    const dup=findDuplicate(url,name,pid||null);
    if(dup){ err.textContent=`Duplicate blocked — ${dup.name} already exists in "${listById(dup.listId).name}".`; err.style.display='block'; return; }
    const vals={name, icp, url, position:document.getElementById('pPos').value.trim(),
      company:document.getElementById('pComp').value.trim(), status:document.getElementById('pStatus').value,
      note:document.getElementById('pNote').value.trim()};
    if(pid){
      const p=S.prospects.find(x=>x.id===pid);
      const stChanged=p.status!==vals.status;
      if(stChanged) p.history.push({ts:Date.now(),user:session.name,from:p.status,to:vals.status});
      Object.assign(p, vals, {updatedAt:Date.now()});
      addActivity(stChanged?'status':'edit', stChanged
        ? `${p.name}: status → ${STATUSES[vals.status]}`
        : `Updated details for ${p.name} in ${listById(listId).name}`);
      toast(`<b>${esc(p.name)}</b> updated`);
    } else {
      const now=Date.now();
      S.prospects.push({id:uid(), listId, ...vals, addedAt:now, updatedAt:now, archived:false,
        history:[{ts:now,user:session.name,from:null,to:vals.status}]});
      addActivity('add', `Added ${vals.name} to ${listById(listId).name}`);
      const l=listById(listId), today=countToday(listId);
      toast(today>=l.dailyTarget ? `<b>${esc(vals.name)}</b> added — daily target of ${l.dailyTarget} reached 🎉`
        : `<b>${esc(vals.name)}</b> added — ${l.dailyTarget-today} to go today`);
    }
    persist(); closeModal(); render(); return;
  }

  if(t.id==='lSave'){
    const err=document.getElementById('lErr');
    const name=document.getElementById('lName').value.trim();
    const icp=document.getElementById('lIcp').value.trim();
    const target=Math.max(1, parseInt(document.getElementById('lTarget').value)||15);
    if(!name||!icp){ err.textContent='List name and ICP category are required.'; err.style.display='block'; return; }
    const lid=t.dataset.lid;
    if(lid){ const l=listById(lid); Object.assign(l,{name,icp,dailyTarget:target});
      addActivity('list', `Updated list settings for ${name}`); }
    else { const id=uid(); S.lists.push({id,name,icp,dailyTarget:target,createdAt:Date.now(),archived:false});
      addActivity('list', `Created list ${name}`); view='list:'+id; }
    persist(); closeModal(); render(); toast(`List <b>${esc(name)}</b> saved`); return;
  }

  if(t.id==='lArchive'){
    const l=listById(t.dataset.lid); l.archived=!l.archived;
    addActivity('list', `${l.archived?'Archived':'Restored'} list ${l.name}`);
    if(l.archived) view='dashboard';
    persist(); closeModal(); render(); toast(`List <b>${esc(l.name)}</b> ${l.archived?'archived':'restored'}`); return;
  }
});

/* status dropdown + filters */
document.addEventListener('change', e=>{
  const st=e.target.closest('[data-status-for]');
  if(st){
    const p=S.prospects.find(x=>x.id===st.dataset.statusFor); if(!p) return;
    const from=p.status; p.status=st.value; p.updatedAt=Date.now();
    p.history.push({ts:Date.now(),user:session.name,from,to:st.value});
    addActivity('status', `${p.name}: ${STATUSES[from]} → ${STATUSES[st.value]}`);
    persist(); render(); toast(`<b>${esc(p.name)}</b> → ${STATUSES[st.value]}`); return;
  }
  const f=e.target.closest('[data-f]');
  if(f && view.startsWith('list:')){
    const lf=filters[view.slice(5)];
    lf[f.dataset.f] = f.type==='checkbox' ? f.checked : f.value;
    render();
    if(f.dataset.f==='q'){ const inp=document.querySelector('[data-f="q"]'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
    return;
  }
});
document.addEventListener('input', e=>{
  const f=e.target.closest('[data-f="q"]');
  if(f && view.startsWith('list:')){
    filters[view.slice(5)].q=f.value;
    clearTimeout(window._qh); window._qh=setTimeout(()=>{ render();
      const inp=document.querySelector('[data-f="q"]'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);} },250);
  }
  const aq=e.target.closest('[data-actq]');
  if(aq){ filters._act=aq.value; clearTimeout(window._ah); window._ah=setTimeout(()=>{ render();
    const inp=document.querySelector('[data-actq]'); if(inp){inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);} },250); }
});
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal();
  if(e.key==='Enter' && e.target.closest('.role-opt')) e.target.closest('.role-opt').click(); });

/* ================= TODAY'S DIGEST (client notification) ================= */
function todayDigest(){
  const k = todayKey();
  const perList = activeLists().map(l=>{
    const ps = listProspects(l.id);
    const added = ps.filter(p=>dayKey(p.addedAt)===k).length;
    const connected = ps.filter(p=>(p.history||[]).some(h=>h.to==='CONNECTED' && dayKey(h.ts)===k)).length;
    const responded = ps.filter(p=>(p.history||[]).some(h=>h.to==='RESPONDED' && dayKey(h.ts)===k)).length;
    return {list:l, added, connected, responded};
  });
  return {
    perList,
    added: perList.reduce((a,x)=>a+x.added,0),
    connected: perList.reduce((a,x)=>a+x.connected,0),
    responded: perList.reduce((a,x)=>a+x.responded,0)
  };
}
function digestModal(){
  const d = todayDigest();
  const dateStr = new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'});
  const rows = d.perList.map(x=>`
    <tr><td style="font-weight:600;color:var(--ink)">${esc(x.list.name)}</td>
    <td style="text-align:center;font-variant-numeric:tabular-nums">${x.added} <span style="color:var(--muted);font-size:11px">/ ${x.list.dailyTarget}</span></td>
    <td style="text-align:center;font-variant-numeric:tabular-nums">${x.connected}</td></tr>`).join('');
  openModal(`
  <div class="modal-head"><h2>Today's snapshot</h2><button class="close-x" data-close aria-label="Close">×</button></div>
  <div class="modal-body">
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:16px">${dateStr} · live figures from the outreach team</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      <div class="card" style="padding:16px;text-align:center;box-shadow:none">
        <div style="font-family:'Archivo';font-size:34px;font-weight:800;color:var(--gold-deep);font-variant-numeric:tabular-nums">${d.added}</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Prospects added today</div></div>
      <div class="card" style="padding:16px;text-align:center;box-shadow:none">
        <div style="font-family:'Archivo';font-size:34px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums">${d.connected}</div>
        <div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)">Connected today</div></div>
    </div>
    ${d.responded?`<p style="font-size:12.5px;color:var(--blue);font-weight:600;margin-bottom:14px">Plus ${d.responded} prospect${d.responded===1?'':'s'} responded today.</p>`:''}
    <div class="tbl-wrap" style="border:1px solid var(--line);border-radius:10px">
      <table><thead><tr><th>List</th><th style="text-align:center">Added today</th><th style="text-align:center">Connected today</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>
  <div class="modal-foot"><button class="btn btn-gold btn-sm" style="width:auto" data-close>Go to dashboard</button></div>`);
}

/* ================= PORTAL ENTRY ================= */
function enterPortal(portal){
  session = portal==='team'
    ? {name:'CrossCore VA', role:'admin', portal:'team'}
    : {name:'Dan Soviero', role:'viewer', portal:'client'};
  document.getElementById('userName').textContent = portal==='team' ? 'CrossCore VA' : 'Client Portal';
  document.getElementById('userRole').textContent = portal==='team' ? 'Full workspace' : 'View only · Dan Soviero';
  document.getElementById('userAvatar').textContent = portal==='team' ? 'C' : 'D';
  document.getElementById('loginView').style.display='none';
  document.getElementById('appShell').classList.add('on');
  view='dashboard'; render();
  if(portal==='client') setTimeout(digestModal, 350);
  if(memoryOnly) toast('Storage unavailable — changes will not persist after this session');
}
document.querySelectorAll('[data-portal]').forEach(b=>b.addEventListener('click', ()=>enterPortal(b.dataset.portal)));
document.getElementById('signOut').addEventListener('click', ()=>{
  session=null;
  document.getElementById('appShell').classList.remove('on');
  document.getElementById('loginView').style.display='flex';
});

/* ================= BOOT ================= */
(async function boot(){
  const saved = await loadState();
  if(saved){ S=saved; }
  else { S=freshState(); await persist(); }
})();
</script>
