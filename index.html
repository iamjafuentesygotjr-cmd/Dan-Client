/* ================= PROJECT CHAT =================
   One shared thread between the CrossCore VA workspace and the client portal.
   Messages ride along in the same synced state document, so both portals see
   them within one poll. Deletes are soft (tombstoned) so a merge can never
   resurrect a removed message. */
const CHAT_NAME = {team:'CrossCore VA', client:'Kallista'};
let chatOpen = false, chatDraft = '', chatReadTimer = null;

function ensureChat(){
  let changed = false;
  if(!Array.isArray(S.messages)){ S.messages = []; changed = true; }
  if(!S.chatRead || typeof S.chatRead !== 'object'){ S.chatRead = {team:0, client:0}; changed = true; }
  return changed;
}
const myPortal = () => (session && session.portal) ? session.portal : 'team';
const chatMsgs = () => (S && Array.isArray(S.messages)) ? S.messages : [];
function chatUnread(){
  const me = myPortal(), since = (S.chatRead && S.chatRead[me]) || 0;
  return chatMsgs().filter(m => m.from !== me && !m.deleted && m.ts > since).length;
}
/* Two-way reconcile of the shared thread. Both portals save the whole state
   document, so a message can only survive a simultaneous save if each side
   folds the other's messages in rather than overwriting. Returns how many we
   took from `other` and whether we still hold something `other` has not seen. */
function reconcileChat(other){
  if(!S) return {gained:0, ahead:false};
  ensureChat();
  if(!other || !Array.isArray(other.messages)) return {gained:0, ahead:false};
  const mine = {}; S.messages.forEach(m => mine[m.id] = m);
  let gained = 0;
  other.messages.forEach(m => {
    const ex = mine[m.id];
    if(!ex){ S.messages.push(m); mine[m.id] = m; gained++; }
    else if(m.deleted && !ex.deleted){ ex.deleted = true; delete ex.text; gained++; }
  });
  if(gained) S.messages.sort((a,b) => a.ts - b.ts);
  const theirs = {}; other.messages.forEach(m => theirs[m.id] = m);
  const ahead = S.messages.some(m => { const t = theirs[m.id]; return !t || (m.deleted && !t.deleted); });
  const r = other.chatRead || {};
  S.chatRead = S.chatRead || {};
  ['team','client'].forEach(k => S.chatRead[k] = Math.max(S.chatRead[k]||0, r[k]||0));
  return {gained, ahead};
}
const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g,
  u => `<a href="${u}" target="_blank" rel="noopener noreferrer" style="color:var(--blue);text-decoration:underline">${u}</a>`);
const chatTime = ts => new Date(ts).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
function chatDayLabel(ts){
  const d = dayKey(ts);
  if(d === todayKey()) return 'Today';
  const y = new Date(); y.setDate(y.getDate()-1);
  if(d === dayKey(y.getTime())) return 'Yesterday';
  return new Date(ts).toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
}
function renderChat(){
  const fab = document.getElementById('chatFab');
  const body = document.getElementById('chatBody');
  if(!fab || !body || !S) return;
  const n = chatUnread();
  fab.classList.toggle('has-unread', n>0);
  document.getElementById('chatBadge').textContent = n>9 ? '9+' : String(n);
  const cw = document.getElementById('chatWarn');
  if(cw) cw.style.display = (backendType==='local'||backendType==='memory') ? 'block' : 'none';
  const who = document.getElementById('chatWho');
  if(who) who.innerHTML = myPortal()==='team'
    ? 'You are <b style="color:#fff;font-weight:700">CrossCore VA</b> &middot; talking to Kallista'
    : 'You are <b style="color:#fff;font-weight:700">Kallista</b> &middot; talking to CrossCore VA';
  if(!chatOpen) return;

  const me = myPortal();
  const msgs = chatMsgs().slice().sort((a,b)=>a.ts-b.ts);
  if(!msgs.length){
    body.innerHTML = `<div class="chat-empty"><b>No messages yet</b>
      <span>This thread is shared between the CrossCore VA workspace and the client portal.
      Anything sent here shows up on the other side within a few seconds.</span></div>`;
    return;
  }
  const nearBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 90;
  let html = '', lastDay = '';
  msgs.forEach(m => {
    const dk = dayKey(m.ts);
    if(dk !== lastDay){ html += `<div class="chat-day">${esc(chatDayLabel(m.ts))}</div>`; lastDay = dk; }
    const mine = m.from === me;
    html += `<div class="msg ${mine?'mine':'theirs'}">
      <div class="msg-who">${esc(mine ? 'You' : (m.name || CHAT_NAME[m.from] || 'Them'))}</div>
      <div class="msg-row">
        <div class="bubble${m.deleted?' gone':''}">${m.deleted ? 'Message deleted' : linkify(m.text)}</div>
        ${(mine && !m.deleted) ? `<button class="msg-del" data-delmsg="${m.id}" title="Delete message" type="button">
          <svg width="12" height="12" viewBox="0 0 13 13" fill="none"><path d="M2.6 3.6h7.8M5.2 3.6V2.5h2.6v1.1M3.6 3.6V10a1 1 0 001 1h3.8a1 1 0 001-1V3.6" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg></button>` : ''}
      </div>
      <div class="msg-time">${esc(chatTime(m.ts))}</div>
    </div>`;
  });
  body.innerHTML = html;
  if(nearBottom || !body.dataset.init){ body.scrollTop = body.scrollHeight; body.dataset.init = '1'; }
}
function markChatRead(){
  if(!S) return;
  ensureChat();
  const me = myPortal();
  const latest = chatMsgs().reduce((a,m)=>Math.max(a,m.ts), 0);
  if((S.chatRead[me]||0) >= latest) return;
  S.chatRead[me] = Math.max(latest, Date.now());
  clearTimeout(chatReadTimer);
  chatReadTimer = setTimeout(()=>persist(), 1200);   /* batch: don't write on every poll */
}
function openChat(){
  chatOpen = true;
  document.getElementById('chatPanel').classList.add('on');
  markChatRead();
  renderChat();
  const ta = document.getElementById('chatInput');
  ta.value = chatDraft; autoGrow(ta); syncSendBtn();
  setTimeout(()=>ta.focus(), 60);
}
function closeChat(){
  chatOpen = false;
  document.getElementById('chatPanel').classList.remove('on');
  renderChat();
}
function autoGrow(ta){ ta.style.height='auto'; ta.style.height = Math.min(ta.scrollHeight, 112)+'px'; }
function syncSendBtn(){
  const ta = document.getElementById('chatInput');
  document.getElementById('chatSend').disabled = !ta.value.trim();
}
async function sendChat(){
  const ta = document.getElementById('chatInput');
  const text = ta.value.trim();
  if(!text || !S) return;
  ensureChat();
  const me = myPortal();
  S.messages.push({id:uid(), ts:Date.now(), from:me, name:CHAT_NAME[me], text});
  S.chatRead[me] = Date.now();
  chatDraft = ''; ta.value = ''; autoGrow(ta); syncSendBtn();
  renderChat();
  const body = document.getElementById('chatBody');
  if(body) body.scrollTop = body.scrollHeight;
  await persist();
  renderChat();
  if(backendType!=='relay') notifyChat(S.messages[S.messages.length-1]);  /* the worker handles it */
}
function deleteChatMsg(id){
  const m = chatMsgs().find(x => x.id === id);
  if(!m || m.from !== myPortal() || m.deleted) return;
  m.deleted = true; delete m.text;
  persist(); renderChat(); toast('Message deleted');
}
document.getElementById('chatFab').addEventListener('click', ()=> chatOpen ? closeChat() : openChat());
document.getElementById('chatClose').addEventListener('click', closeChat);
document.getElementById('chatSend').addEventListener('click', sendChat);
document.getElementById('chatBody').addEventListener('click', e=>{
  const b = e.target.closest('[data-delmsg]');
  if(b) deleteChatMsg(b.dataset.delmsg);
});
document.getElementById('chatInput').addEventListener('input', e=>{
  chatDraft = e.target.value; autoGrow(e.target); syncSendBtn();
});
document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); }
});
document.addEventListener('keydown', e=>{
  if(e.key === 'Escape' && chatOpen && !document.getElementById('overlay').classList.contains('on')) closeChat();
});

/* ================= LEAD NOTES =================
   Each lead carries an outreach note. It is generated from the active default
   template unless the VA has written their own, in which case `noteCustom`
   protects it from every future default rollout. Context that came from the
   import (industry, location, prior-contact tags) lives in `context`, separate
   from the note, so a rollout can never eat it. */
const NOTE_TOKENS = [
  {t:'{first}',   d:'First name',  f:p=>firstName(p.name)},
  {t:'{name}',    d:'Full name',   f:p=>(p.name||'').trim()},
  {t:'{company}', d:'Company',     f:p=>(p.company||'').trim()},
  {t:'{position}',d:'Position',    f:p=>(p.position||'').trim()}
];
function resolveNote(tpl, p){
  let s = String(tpl||'');
  NOTE_TOKENS.forEach(k=>{ s = s.split(k.t).join(k.f(p)); });
  return s.replace(/[ \t]{2,}/g,' ').replace(/\s+([,.!?])/g,'$1').trim();
}
/* leads where a token in the draft resolves to nothing — "saw your work at {company}"
   reads badly for a lead with no company on file, so say so before any rollout */
function noteTokenGaps(text){
  const ps = S.prospects.filter(p=>!p.archived && isActiveListId(p.listId) && !p.noteCustom);
  return NOTE_TOKENS.filter(k => String(text||'').includes(k.t)).map(k=>{
    const bad = ps.filter(p => !k.f(p));
    return {token:k.t, missing:bad.length, who: bad.length?bad[0].name:'', sample: bad.length?resolveNote(text, bad[0]):''};
  }).filter(g => g.missing > 0);
}
function gapWarning(text){
  const gaps = noteTokenGaps(text);
  if(!gaps.length) return '';
  return `<div class="gap-warn"><b>Heads up</b>${gaps.map(g=>
    `<div style="margin-top:5px"><b>${esc(g.missing)}</b> lead${g.missing===1?'':'s'} have no <code>${esc(g.token)}</code> on file.
     For ${esc(g.who)} the note would read: &ldquo;${esc(g.sample)}&rdquo;</div>`).join('')}
    <div style="margin-top:6px;color:var(--muted)">Either drop that token, or edit those leads individually afterwards.</div></div>`;
}
const activeTpl = () => (S.noteTemplates||[]).find(t=>t.id===S.activeNoteId) || null;
const activeTplText = () => { const t=activeTpl(); return t ? t.text : ''; };
/* the note the copy icon hands over */
function leadNote(p){
  if(p.note) return p.note;
  const t = activeTplText();
  return t ? resolveNote(t, p) : '';
}
/* how many leads a rollout would touch */
function rolloutCounts(){
  const ps = S.prospects.filter(p=>!p.archived && isActiveListId(p.listId));
  return {total:ps.length, custom:ps.filter(p=>p.noteCustom).length, update:ps.filter(p=>!p.noteCustom).length};
}
const isActiveListId = id => { const l=listById(id); return !!l && !l.archived; };
function applyDefaultNote(tplId, scopeAll){
  const t = (S.noteTemplates||[]).find(x=>x.id===tplId);
  if(!t) return 0;
  let n = 0;
  S.prospects.forEach(p=>{
    if(!scopeAll && !isActiveListId(p.listId)) return;
    if(p.noteCustom) return;
    const next = resolveNote(t.text, p);
    if(p.note !== next){ p.note = next; n++; }
  });
  S.activeNoteId = tplId;
  t.activatedAt = Date.now();
  return n;
}
/* one-time: give notes their own lane, seed the first default */
function applyNotesV2(){
  if(S.notesV2) return false;
  let moved = 0;
  S.prospects.forEach(p=>{
    if(p.note && !p.noteCustom){ p.context = p.note; p.note = ''; moved++; }
    if(p.noteCustom === undefined) p.noteCustom = false;
  });
  if(!Array.isArray(S.noteTemplates)) S.noteTemplates = [];
  if(!S.noteTemplates.length){
    S.noteTemplates.push({id:uid(), text:'Hey {first}! Would love to connect.',
      createdAt:Date.now(), activatedAt:null, createdBy:'System'});
  }
  const n = applyDefaultNote(S.noteTemplates[0].id, true);
  S.notesV2 = true;
  S.activity.unshift({id:uid(), ts:Date.now(), user:'System', action:'edit',
    detail:`Lead notes enabled — default note "${S.noteTemplates[0].text}" applied to ${n} leads${moved?`; ${moved} imported industry/location notes moved to the lead's context line`:''}`});
  return true;
}
function ensureNotes(){
  let changed=false;
  if(!Array.isArray(S.noteTemplates)){ S.noteTemplates=[]; changed=true; }
  if(S.activeNoteId===undefined){ S.activeNoteId=null; changed=true; }
  return changed;
}

/* ================= CHAT NOTIFICATIONS =================
   The page has no server of its own, so it hands each new message to a small
   relay (a Cloudflare Worker — see chat-notify-worker.js) that holds the mail
   credentials and owns the recipient list. The sender's browser makes the call,
   which is reliable because the sender is by definition online at that moment. */
const NTF_DEFAULTS = {
  enabled:false, url:'', appUrl:'', token:'',
  quietSeconds:60,      /* one notification per burst */
  activeSeconds:120,    /* silence if they are already reading */
  recipients:{
    team:  {name:'JA (CrossCore VA)',   email:'ja.crosscore@gmail.com'},
    client:{name:'Kallista Capparelli', email:'kc7@signaturelocker.com'}
  }
};
function ensureNotify(){
  let changed=false;
  if(!S.notify){ S.notify = JSON.parse(JSON.stringify(NTF_DEFAULTS)); changed=true; }
  const n = S.notify;
  Object.keys(NTF_DEFAULTS).forEach(k=>{ if(n[k]===undefined){ n[k]=JSON.parse(JSON.stringify(NTF_DEFAULTS[k])); changed=true; } });
  if(!n.recipients) { n.recipients = JSON.parse(JSON.stringify(NTF_DEFAULTS.recipients)); changed=true; }
  ['team','client'].forEach(p=>{ if(!n.recipients[p]){ n.recipients[p]=JSON.parse(JSON.stringify(NTF_DEFAULTS.recipients[p])); changed=true; } });
  if(!Array.isArray(n.log)){ n.log=[]; changed=true; }
  if(!Array.isArray(n.queue)){ n.queue=[]; changed=true; }
  if(!n.lastSent){ n.lastSent={team:0,client:0}; changed=true; }
  /* a deployed relay means notifications are wanted — switch them on once,
     rather than leaving a hidden toggle that silently sends nothing */
  if(RELAY_URL && !n.relayOn){ n.enabled = true; n.relayOn = true; changed = true; }
  /* email-only: clear any phone number left over from an earlier version */
  ['team','client'].forEach(p=>{
    const r = n.recipients[p];
    if(r && ('sms' in r || 'smsEnabled' in r)){ delete r.sms; delete r.smsEnabled; changed = true; }
  });
  return changed;
}
function ntfLog(status, to, detail){
  ensureNotify();
  S.notify.log.unshift({id:uid(), ts:Date.now(), status, to, detail:String(detail||'').slice(0,160)});
  if(S.notify.log.length>25) S.notify.log.length=25;
}
/* deep link that drops the recipient straight into the open thread */
function chatLink(portal){
  const base = (S.notify && S.notify.appUrl || '').trim().replace(/[?#].*$/,'').replace(/\/+$/,'');
  if(!base) return '';
  return base + '?portal=' + portal + '&chat=1';
}
/* decide whether this message earns a notification, and build its payload */
function buildNotice(msg){
  ensureNotify();
  const n = S.notify;
  const to = msg.from === 'team' ? 'client' : 'team';
  const r  = n.recipients[to] || {};
  if(!n.enabled)          return {skip:'notifications are switched off'};
  if(!n.url)              return {skip:'no relay URL configured'};
  if(!r.email) return {skip:'no email address on file for '+(r.name||to)};
  const now = Date.now();
  const readAt = (S.chatRead && S.chatRead[to]) || 0;
  if(now - readAt < (n.activeSeconds||120)*1000)
    return {skip:(r.name||to)+' is reading the chat right now'};
  if(now - ((n.lastSent||{})[to]||0) < (n.quietSeconds||60)*1000)
    return {skip:'already notified '+(r.name||to)+' in the last '+(n.quietSeconds||60)+'s'};
  /* carry everything they have not read, so one mail covers a whole burst */
  const unread = chatMsgs()
    .filter(m => m.from !== to && !m.deleted && m.ts > readAt)
    .slice(-10)
    .map(m => ({from:m.name || CHAT_NAME[m.from], ts:m.ts, text:m.text}));
  return {payload:{
    id: msg.id,
    event: 'chat_message',
    sentAt: msg.ts,
    from: {portal: msg.from, name: msg.name || CHAT_NAME[msg.from]},
    to:   {portal: to, name: r.name || CHAT_NAME[to], email: r.email || ''},
    channels: ['email'],
    preview: (msg.text||'').slice(0, 280),
    unreadCount: unread.length,
    messages: unread,
    link: chatLink(to)
  }};
}
async function postNotice(payload){
  const n = S.notify;
  const url = RELAY_URL ? (RELAY_URL.replace(/\/+$/,'') + '/notify') : n.url;
  const headers = {'Content-Type':'application/json'};
  const tok = RELAY_URL ? RELAY_TOKEN : n.token;
  if(tok) headers['X-Desk-Token'] = tok;
  const res = await fetch(url, {method:'POST', headers, body:JSON.stringify(payload), keepalive:true});
  if(!res.ok) throw new Error('relay responded ' + res.status);
  return res;
}
async function notifyChat(msg){
  if(!S || backendType==='relay') return;   /* server-side worker owns this */
  const built = buildNotice(msg);
  if(built.skip){ ntfLog('skipped', msg.from==='team'?'client':'team', built.skip); return; }
  const p = built.payload;
  try{
    await postNotice(p);
    S.notify.lastSent[p.to.portal] = Date.now();
    ntfLog('sent', p.to.portal, 'email · ' + p.to.email);
  }catch(e){
    /* hold it and try again on the next poll rather than losing the alert */
    S.notify.queue.push({tries:1, at:Date.now(), payload:p});
    if(S.notify.queue.length>20) S.notify.queue.shift();
    ntfLog('queued', p.to.portal, e.message + ' — will retry');
  }
  persist();
}
/* retry anything the relay refused earlier (own portal only, so two tabs
   can't both flush the same alert) */
let ntfFlushing = false;
async function flushNotices(){
  if(ntfFlushing || !S || !S.notify || !S.notify.enabled || !S.notify.url) return;
  const mine = (S.notify.queue||[]).filter(q => q.payload && q.payload.from.portal === myPortal());
  if(!mine.length) return;
  ntfFlushing = true;
  let changed = false;
  for(const item of mine.slice(0,3)){
    try{
      await postNotice(item.payload);
      S.notify.queue = S.notify.queue.filter(q => q !== item);
      S.notify.lastSent[item.payload.to.portal] = Date.now();
      ntfLog('sent', item.payload.to.portal, 'delivered on retry');
      changed = true;
    }catch(e){
      item.tries = (item.tries||1) + 1;
      if(item.tries > 6){
        S.notify.queue = S.notify.queue.filter(q => q !== item);
        ntfLog('failed', item.payload.to.portal, 'gave up after 6 tries — ' + e.message);
        changed = true;
      }
    }
  }
  ntfFlushing = false;
  if(changed){ persist(); if(view==='integration' && session) render(); }
}
async function sendTestNotice(){
  ensureNotify();
  if(!S.notify.url && !RELAY_URL){ toast('Add the relay URL first'); return; }
  const to = myPortal()==='team' ? 'client' : 'team';
  const r = S.notify.recipients[to]||{};
  const p = {id:uid(), event:'test', sentAt:Date.now(),
    from:{portal:myPortal(), name:CHAT_NAME[myPortal()]},
    to:{portal:to, name:r.name||to, email:r.email||''},
    channels:['email'],
    preview:'Test alert from the Prospect Desk — notifications are wired up correctly.',
    unreadCount:1,
    messages:[{from:CHAT_NAME[myPortal()], ts:Date.now(), text:'Test alert from the Prospect Desk — notifications are wired up correctly.'}],
    link:chatLink(to)};
  toast('Sending test…');
  try{
    await postNotice(p);
    ntfLog('sent', to, 'test alert · ' + p.to.email);
    toast(`Test sent to <b>${esc(p.to.email)}</b>`);
  }catch(e){
    ntfLog('failed', to, 'test — ' + e.message);
    toast('⚠ Test failed — ' + esc(e.message));
  }
  persist(); render();
}

/* ---- notification settings handlers ---- */
document.addEventListener('click', e=>{

/* ================= TODAY'S DIGEST (client notification) ================= */
let sinceSnap = null; /* computed at client portal entry, before the visit is recorded */
function sinceStats(ts){
  if(!ts) return null;
  const ps = liveProspects();
  const newAdds = ps.filter(p=>p.addedAt>ts).length;
  const sent = ps.filter(p=>(p.history||[]).some(h=>h.to==='REQUEST_SENT' && h.ts>ts)).length;
  const conn = ps.filter(p=>(p.history||[]).some(h=>h.to==='CONNECTED' && h.ts>ts)).length;
  const resp = ps.filter(p=>(p.history||[]).some(h=>h.to==='RESPONDED' && h.ts>ts)).length;
  return {ts, newAdds, sent, conn, resp};

function todayDigest(){
  const k = todayKey();
  const perList = activeLists().map(l=>{
    const ps = listProspects(l.id);
    const added = ps.filter(p=>dayKey(p.addedAt)===k).length;
    const sent = ps.filter(p=>(p.history||[]).some(h=>h.to==='REQUEST_SENT' && dayKey(h.ts)===k)).length;
    const connected = ps.filter(p=>(p.history||[]).some(h=>h.to==='CONNECTED' && dayKey(h.ts)===k)).length;
    const responded = ps.filter(p=>(p.history||[]).some(h=>h.to==='RESPONDED' && dayKey(h.ts)===k)).length;
    return {list:l, added, sent, connected, responded};
  });
  return {
    perList,
    added: perList.reduce((a,x)=>a+x.added,0),
    sent: perList.reduce((a,x)=>a+x.sent,0),
    connected: perList.reduce((a,x)=>a+x.connected,0),
    responded: perList.reduce((a,x)=>a+x.responded,0)
  };
}

(async function boot(){
  let shared=null, adopted=null;
  if(backendType==='relay'){
    /* prove the backend is really there before trusting it with the data */
    try{ await relayLoad(true); }
    catch(e){
      relayError = e.message;
      try{ const t='__ccopc__'; window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t); backendType='local'; }
      catch(e2){ backendType='memory'; memoryOnly=true; }
    }
  }
  if(backendType==='relay'){
    adopted = await loadState().catch(()=>null);
    shared = adopted;
  } else if(backendType==='claude'){
    shared = await readShared();
    const legacy = await readLegacyPersonal();
    adopted = (shared && legacy) ? (((legacy.rev||0) > (shared.rev||0)) ? legacy : shared) : (shared || legacy);
  } else {
    adopted = await loadState();
    shared = adopted;
  }
  let needWrite = false;
  if(adopted){ S = adopted; if(adopted !== shared) needWrite = true; /* migrate newer legacy copy into shared */ }
  else { S = freshState(); needWrite = true; }
  if(applyGrowToro()) needWrite = true;
  if(applySept2026()) needWrite = true;
  if(ensureChat()) needWrite = true;
  if(ensureNotify()) needWrite = true;
  if(ensureNotes()) needWrite = true;
  if(applyNotesV2()) needWrite = true;
  if(needWrite) await persist();
  lastSyncAt = Date.now();
  updateSyncStat();
  /* deep link from a notification email: ?portal=client&chat=1 */
  try{
    const q = new URLSearchParams(location.search);
    const p = q.get('portal');
    if(p==='team' || p==='client'){
      enterPortal(p);
      if(q.get('chat')==='1' || location.hash==='#chat') setTimeout(openChat, 420);
    }
  }catch(e){}
})();

/* ---------- merging two copies of the document (newer edit of each record wins) ---------- */
/* one record from two copies: start from the newer copy, then take every field the other copy changed more recently */

/* ===== the survey segments are real prospect lists, so they track and report exactly like the other lists =====

   Responded · Follow-up), same dashboard card, same daily digest in Dan's portal, same lead list in the Cross Core Ops
   Suite (which already reads every active desk list). Each survey prospect is linked to exactly one desk prospect, so a

        addedAt:t, updatedAt:t, archived:false, note:'', noteCustom:true, ivsId:r.id, history:[{ts:t, user:'Investor Survey 2027', from:null, to:'NOT_CONNECTED'}]};
      S.prospects.push(dp); byId[dp.id] = dp; byUrl[ivsCanon(r.url)] = dp; ch = true; }
