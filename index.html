<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prospect Desk · Cross Core OPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#161310; --ink-2:#221E18; --ink-3:#2E2820;
  --paper:#F8F6F0; --card:#FFFFFF; --line:#E8E2D4; --line-soft:#F0EBDF;
  --gold:#F2B90D; --gold-deep:#DE9200; --gold-soft:#FBF3DA;
  --muted:#8B8374; --body:#3D3830;
  --green:#1F8A5B; --green-soft:#E4F3EC;
  --blue:#2563EB; --blue-soft:#E8EEFC;
  --amber:#C97E00; --amber-soft:#FCF0D8;
  --red:#C2410C; --red-soft:#FBEAE1;
  --gray:#857D6F; --gray-soft:#EFECE4;
  --danger:#B3261E;
  --r:14px; --r-sm:9px;
  --shadow:0 1px 2px rgba(22,19,16,.05),0 8px 28px -12px rgba(22,19,16,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.display{font-family:'Archivo',sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--ink)}
a{color:inherit}
::selection{background:var(--gold);color:var(--ink)}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:linear-gradient(140deg,#161310 0%,#221B0E 55%,#3A2A08 100%);position:relative;overflow:hidden}
.login-wrap::after{content:"";position:absolute;inset:auto -20% -55% -20%;height:70%;
  background:radial-gradient(ellipse at center,rgba(242,185,13,.22),transparent 65%)}
.login-card{position:relative;z-index:1;width:100%;max-width:430px;background:var(--card);border-radius:20px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);overflow:hidden}
.login-band{height:6px;background:linear-gradient(90deg,var(--gold-deep),var(--gold) 60%,#FFD75E)}
.login-inner{padding:36px 36px 30px}
.brand-row{display:flex;align-items:center;gap:11px;margin-bottom:26px}
.brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.brand-mark svg{display:block}
.brand-name{font-family:'Archivo';font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--ink)}
.brand-sub{font-size:10.5px;letter-spacing:.22em;color:var(--muted);font-weight:600}
.login-inner h1{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.login-inner .lede{color:var(--muted);font-size:13.5px;margin-bottom:24px}
.role-grid{display:grid;gap:9px;margin-bottom:18px}
.role-opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;transition:.15s}
.role-opt:hover{border-color:#CFC7B2}
.role-opt.sel{border-color:var(--gold-deep);background:var(--gold-soft)}
.role-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:.15s}
.role-opt.sel .role-dot{background:var(--gold-deep)}
.role-opt b{display:block;font-size:13.5px;color:var(--ink)}
.role-opt span{font-size:12px;color:var(--muted)}
.field{margin-bottom:14px}
.field label{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold-deep);box-shadow:0 0 0 3px rgba(222,146,0,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:10px;padding:11px 18px;font-weight:600;font-size:13.5px;transition:.15s}
.btn-gold{background:var(--gold);color:var(--ink);width:100%}
.btn-gold:hover{background:#E8AF06}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:var(--ink-3)}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:#CFC7B2}
.btn-danger{background:var(--red-soft);color:var(--danger)}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.login-err{color:var(--danger);font-size:12.5px;margin:-6px 0 12px;display:none}
.login-note{margin-top:18px;padding:11px 13px;background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;font-size:12px;color:var(--muted)}
.login-note code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:11px;color:var(--ink)}

/* ---------- shell ---------- */
.shell{display:none;min-height:100vh}
.shell.on{display:flex}
.side{width:232px;flex:none;background:var(--ink);color:#B7AFA0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side-brand{display:flex;align-items:center;gap:10px;padding:22px 20px 18px;border-bottom:1px solid rgba(255,255,255,.07)}
.side-brand .brand-name{color:#fff;font-size:13px}
.side-brand .brand-sub{color:#8F8776}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.2em;color:#6E675A;padding:14px 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;background:transparent;border:none;color:#B7AFA0;font-size:13px;font-weight:500;text-align:left;width:100%;position:relative;transition:.13s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:rgba(242,185,13,.13);color:var(--gold)}
.nav-item.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav-item .cnt{margin-left:auto;font-size:11px;color:#7C7466;font-variant-numeric:tabular-nums}
.nav-item.on .cnt{color:var(--gold-deep)}
.side-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.07);font-size:12px}
.side-user{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.side-user b{color:#fff;display:block;font-size:12.5px}
.side-user span{color:#8F8776;font-size:11px}
.signout{background:none;border:none;color:#8F8776;font-size:12px;padding:0;text-decoration:underline}
.signout:hover{color:#fff}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:5px;background:linear-gradient(90deg,var(--gold-deep),var(--gold) 55%,#FFD75E)}
.page{padding:30px 38px 60px;max-width:1160px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:6px}
.page-head h1{font-size:26px;font-weight:700;letter-spacing:-.015em}
.page-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
.head-actions{display:flex;gap:9px;flex-wrap:wrap}

/* ---------- cards & kpis ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{padding:16px 18px}
.kpi .k-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .k-val{font-family:'Archivo';font-size:28px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;margin-top:4px}
.kpi .k-note{font-size:11.5px;color:var(--muted);margin-top:2px}

.list-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.lc{padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.15s}
.lc:hover{border-color:#D8CFBB;transform:translateY(-1px)}
.lc-top{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.lc-title b{font-family:'Archivo';font-size:15.5px;color:var(--ink);display:block;letter-spacing:-.01em}
.lc-title span{font-size:12px;color:var(--muted)}
.lc-week{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.bar{height:6px;border-radius:4px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--gold-deep),var(--gold))}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}

/* status colors */
.st-NOT_CONNECTED{background:var(--gray-soft);color:var(--gray)}
.st-REQUEST_SENT{background:var(--amber-soft);color:var(--amber)}
.st-CONNECTED{background:var(--green-soft);color:var(--green)}
.st-RESPONDED{background:var(--blue-soft);color:var(--blue)}
.st-FOLLOW_UP{background:var(--red-soft);color:var(--red)}

/* ---------- table ---------- */
.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type=text],.toolbar input[type=date],.toolbar select{padding:8.5px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;outline:none}
.toolbar input[type=text]{min-width:220px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--gold-deep)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FCFAF5}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FCFAF4}
td .p-name{font-weight:600;color:var(--ink)}
td .p-pos{font-size:11.5px;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.link-btn{font-size:12px;color:var(--gold-deep);font-weight:600;text-decoration:none;border-bottom:1px solid transparent}
.link-btn:hover{border-color:var(--gold-deep)}
.st-select{border:1.5px solid transparent;border-radius:20px;font-size:11.5px;font-weight:600;padding:4px 8px;appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}
.row-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-btn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);transition:.12s}
.icon-btn:hover{color:var(--ink);border-color:#CFC7B2}
.icon-btn.danger:hover{color:var(--danger);border-color:var(--danger)}
.empty{padding:44px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:'Archivo';font-size:15px;margin-bottom:4px}
.count-note{font-size:12px;color:var(--muted);margin:10px 2px 0}
.badge-arch{font-size:10.5px;font-weight:600;color:var(--muted);background:var(--gray-soft);border-radius:4px;padding:2px 6px;margin-left:6px}

/* target strip on list page */
.target-strip{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ts-card{flex:1;min-width:200px;padding:15px 18px;display:flex;align-items:center;gap:14px}
.ts-card .t-num{font-family:'Archivo';font-size:22px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.ts-card .t-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ts-card .t-sub{font-size:11.5px;color:var(--muted)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(22,19,16,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 20px;z-index:50;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:520px;box-shadow:0 30px 80px -20px rgba(0,0,0,.4);overflow:hidden}
.modal-head{padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center}
.modal-head h2{font-size:17px;font-weight:700}
.modal-body{padding:18px 24px 24px}
.modal .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:0 24px 22px}
.close-x{background:none;border:none;font-size:20px;color:var(--muted);line-height:1}
.form-err{color:var(--danger);font-size:12.5px;margin-bottom:12px;display:none}

/* ---------- activity ---------- */
.act-row td:first-child{white-space:nowrap;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.act-chip{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2.5px 8px;border-radius:5px;text-transform:uppercase}
.ac-add{background:var(--green-soft);color:var(--green)}
.ac-status{background:var(--blue-soft);color:var(--blue)}
.ac-edit{background:var(--amber-soft);color:var(--amber)}
.ac-archive,.ac-delete{background:var(--gray-soft);color:var(--gray)}
.ac-list,.ac-access,.ac-import{background:var(--gold-soft);color:var(--gold-deep)}

/* ---------- integration ---------- */
.int-status{display:flex;align-items:center;gap:14px;padding:20px 22px;margin-bottom:16px}
.int-dot{width:11px;height:11px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px rgba(242,185,13,.18);flex:none}
.int-status b{font-family:'Archivo';font-size:15px;color:var(--ink);display:block}
.int-status span{font-size:12.5px;color:var(--muted)}
.int-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.int-card{padding:20px 22px}
.int-card h3{font-size:14px;margin-bottom:8px}
.int-card p{font-size:12.8px;color:var(--body);margin-bottom:10px}
.int-card ul{margin:0 0 12px 17px;font-size:12.8px;color:var(--body)}
.int-card li{margin-bottom:5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;margin-bottom:10px}
.tag-ok{background:var(--green-soft);color:var(--green)}
.tag-wait{background:var(--gray-soft);color:var(--gray)}
.note-box{margin-top:16px;padding:14px 16px;background:var(--gold-soft);border:1px solid #EED9A0;border-radius:10px;font-size:12.5px;color:#6B5205}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--gold)}

/* section titles */
.sec-title{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:26px 0 12px}

/* ---------- lead notes ---------- */
.note-cell{display:flex;align-items:flex-start;gap:5px;min-width:210px;max-width:330px}
.note-txt{flex:1;font-size:12.6px;line-height:1.45;color:var(--body);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.note-txt.empty{color:var(--muted);font-style:italic}
.note-tag{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold-deep);background:var(--gold-soft);border-radius:5px;padding:0 5px;margin-left:5px;vertical-align:1px}
.note-acts{display:flex;gap:1px;flex:none}
.note-ed{width:100%;min-width:250px}
.note-ed textarea{width:100%;border:1.5px solid var(--gold-deep);border-radius:9px;padding:7px 9px;font-size:12.6px;line-height:1.45;resize:vertical;min-height:58px;background:#fff}
.note-ed textarea:focus{outline:none}
.note-ed .ne-row{display:flex;gap:6px;align-items:center;margin-top:6px}
.note-ed .ne-hint{font-size:11px;color:var(--muted);margin-left:auto}
.p-ctx{display:block;font-size:11px;color:var(--muted);margin-top:2px}
/* default-note manager */
.tpl-list{margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px;max-height:210px;overflow-y:auto}
.tpl-row{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:7px;background:#fff}
.tpl-row.on{border-color:var(--gold-deep);background:var(--gold-soft)}
.tpl-row .tr-t{flex:1;font-size:12.8px;line-height:1.45;color:var(--ink)}
.tpl-row .tr-m{font-size:11px;color:var(--muted);margin-top:3px}
.tok{display:inline-block;background:var(--ink);color:var(--gold);border-radius:5px;padding:1px 6px;font-size:11px;
  font-family:ui-monospace,Menlo,monospace;margin-right:5px;cursor:pointer}
.note-prev{background:var(--paper);border:1px solid var(--line-soft);border-radius:10px;padding:11px 13px;margin-top:10px}
.note-prev b{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.solo-warn{display:flex;gap:12px;align-items:flex-start;background:#FBEAE1;border:1px solid #F0C4AC;
  border-left:4px solid var(--red);border-radius:12px;padding:13px 16px;margin-bottom:18px}
.solo-warn b{display:block;font-family:'Archivo';font-size:13.5px;color:var(--ink);margin-bottom:3px}
.solo-warn span{font-size:12.8px;line-height:1.55;color:var(--body)}
.solo-warn code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 5px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.chat-warn{background:#FBEAE1;border-bottom:1px solid #F0C4AC;padding:9px 14px;font-size:11.8px;line-height:1.45;color:#8A3B18;flex:none}
.gap-warn{background:var(--amber-soft);border:1px solid #F0DCA8;border-radius:11px;padding:11px 13px;margin-top:11px;font-size:12.6px;line-height:1.5;color:var(--ink)}
.gap-warn b{font-weight:700}
.gap-warn code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
.confirm-box{background:var(--gold-soft);border:1px solid #EBD79A;border-radius:11px;padding:13px 15px;margin-top:12px}
.confirm-box ul{margin:8px 0 0 18px;font-size:13px;line-height:1.65}
/* ---------- notification settings ---------- */
.ntf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:14px 0 4px}
.ntf-f label{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.ntf-f input{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--paper)}
.ntf-f input:focus{outline:none;border-color:var(--gold-deep);background:#fff}
.ntf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.ntf-log{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:12px}
.ntf-log table{width:100%;border-collapse:collapse;font-size:12.5px}
.ntf-log td{padding:6px 8px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.ntf-log tr:last-child td{border-bottom:none}
.ntf-st{display:inline-block;padding:1px 8px;border-radius:7px;font-size:11px;font-weight:700}
.ntf-sent{background:var(--green-soft);color:var(--green)}
.ntf-skip{background:var(--gray-soft);color:var(--gray)}
.ntf-fail{background:var(--red-soft);color:var(--red)}
.ntf-queued{background:var(--amber-soft);color:var(--amber)}
/* ---------- project chat ---------- */
.chat-fab{position:fixed;right:22px;bottom:22px;z-index:40;width:56px;height:56px;border-radius:50%;
  background:var(--ink);border:none;display:none;align-items:center;justify-content:center;
  box-shadow:0 12px 30px -8px rgba(22,19,16,.55);transition:transform .16s, background .16s}
.chat-fab:hover{background:var(--ink-3);transform:translateY(-2px)}
#appShell.on ~ .chat-fab{display:flex}
#appShell:not(.on) ~ .chat-panel{display:none!important}
.chat-fab .fab-badge{position:absolute;top:-3px;right:-3px;min-width:21px;height:21px;padding:0 6px;border-radius:11px;
  background:var(--gold);color:var(--ink);font-family:'Archivo';font-weight:800;font-size:11px;
  display:none;align-items:center;justify-content:center;border:2.5px solid var(--paper)}
.chat-fab.has-unread .fab-badge{display:flex}
.chat-panel{position:fixed;right:22px;bottom:22px;z-index:45;width:372px;max-width:calc(100vw - 32px);
  height:min(560px,calc(100vh - 44px));background:var(--card);border-radius:18px;overflow:hidden;
  box-shadow:0 30px 70px -18px rgba(22,19,16,.45),0 0 0 1px var(--line);

.chat-panel.on{display:flex;opacity:1;transform:none}
.chat-head{background:var(--ink);color:#fff;padding:14px 14px 13px 16px;display:flex;align-items:center;gap:10px;flex:none}
.chat-head .ch-t{font-family:'Archivo';font-weight:700;font-size:14.5px;letter-spacing:.01em}
.chat-head .ch-s{font-size:11.5px;color:#A9A192;margin-top:1px}
.chat-head .ch-x{margin-left:auto;background:none;border:none;color:#A9A192;font-size:21px;line-height:1;padding:0 2px}
.chat-head .ch-x:hover{color:#fff}
.chat-body{flex:1;overflow-y:auto;padding:16px 14px 6px;background:var(--paper);display:flex;flex-direction:column;gap:9px}
.chat-day{align-self:center;background:var(--card);border:1px solid var(--line-soft);color:var(--muted);
  font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:9px;margin:6px 0 2px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg.mine{align-self:flex-end;align-items:flex-end}
.msg.theirs{align-self:flex-start}
.msg-who{font-size:10.5px;color:var(--muted);font-weight:600;padding:0 3px}
.msg-row{display:flex;align-items:flex-start;gap:5px}
.msg.mine .msg-row{flex-direction:row-reverse}
.bubble{padding:9px 12px;border-radius:13px;font-size:13.2px;line-height:1.48;white-space:pre-wrap;word-break:break-word}
.msg.theirs .bubble{background:var(--card);border:1px solid var(--line);color:var(--body);border-bottom-left-radius:5px}
.msg.mine .bubble{background:var(--gold-soft);border:1px solid #EBD79A;color:var(--ink);border-bottom-right-radius:5px}
.bubble.gone{background:transparent;border:1px dashed var(--line);color:var(--muted);font-style:italic;font-size:12.5px}
.msg-del{background:none;border:none;color:var(--muted);opacity:0;padding:4px 2px;transition:.14s;flex:none}
.msg:hover .msg-del{opacity:.75}
.msg-del:hover{opacity:1;color:var(--danger)}
.msg-time{font-size:10px;color:var(--muted);padding:0 4px}
.chat-empty{margin:auto;text-align:center;color:var(--muted);padding:26px 18px}
.chat-empty b{display:block;font-family:'Archivo';color:var(--ink);font-size:14px;margin-bottom:5px}
.chat-empty span{font-size:12.5px;line-height:1.55}
.chat-foot{flex:none;border-top:1px solid var(--line);background:var(--card);padding:10px 11px 11px;display:flex;gap:8px;align-items:flex-end}
#chatInput{flex:1;resize:none;border:1.5px solid var(--line);border-radius:11px;padding:9px 11px;
  font-size:13.2px;line-height:1.45;max-height:112px;min-height:38px;background:var(--paper);color:var(--ink);outline:none}
#chatInput:focus{border-color:var(--gold-deep);background:#fff}
.chat-send{flex:none;width:38px;height:38px;border-radius:11px;background:var(--gold);border:none;
  display:flex;align-items:center;justify-content:center;transition:.15s}
.chat-send:hover{background:#E8AF06}
.chat-send:disabled{background:var(--gray-soft);cursor:default}
@media (max-width:560px){
  .chat-panel{right:10px;left:10px;bottom:10px;width:auto;height:min(72vh,calc(100vh - 20px))}
  .chat-fab{right:16px;bottom:16px}
}

  .nav{flex-direction:row;flex-wrap:wrap;padding:8px}
  .nav-label{display:none}
  .nav-item.on::before{display:none}
  .side-foot{border-top:none;margin-left:auto}
  .page{padding:20px 16px 60px}
  .int-grid{grid-template-columns:1fr}
  .modal .grid2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
:focus-visible{outline:2px solid var(--gold-deep);outline-offset:2px}

/* Merge GrowToro leads into the existing Investors list (runs once, works on fresh or saved data) */
function applyGrowToro(){
  if(S.growtoroApplied) return false;
  const listId='investor';
  const byName={}, byUrl={};
  S.prospects.forEach(p=>{
    if(p.listId===listId) byName[p.name.trim().toLowerCase()]=p;
    const c=canon(p.url); if(c) byUrl[c]=p;
  });
  let added=0, linked=0;
  GROWTORO.forEach(r=>{
    const [name, company, url, status, cd]=r;
    const ex=byName[name.trim().toLowerCase()] || (url?byUrl[canon(url)]:null);
    if(ex){
      if(url && !ex.url){ ex.url=url; ex.updatedAt=Date.now(); linked++; }
      if(company && !ex.company) ex.company=company;
      return;
    }
    const t=cd?new Date(cd+'T10:00:00').getTime():Date.now();
    const p={id:uid(), listId, name, position:'', company, icp:'GrowToro Investor Lead',
      url:url||'', status, addedAt:t, updatedAt:t, archived:false, note:'',
      history:[{ts:t,user:'GrowToro import',from:null,to:status}]};
    S.prospects.push(p);
    byName[name.trim().toLowerCase()]=p;
    added++;
  });
  S.growtoroApplied=true;
  S.activity.unshift({id:uid(), ts:Date.now(), user:'System', action:'import',
    detail:`Merged GrowToro lead list into Investors — Tier 1: ${added} new prospects added, ${linked} profile links filled in`});
  return true;
}
/* Import the September 2026 Investor Lead List into its own list and close the two
   completed projects (runs once, works on fresh or already-saved data) */
function applySept2026(){
  if(S.sept2026Applied) return false;
  const listId='sept2026';
  if(!S.lists.some(l=>l.id===listId)){
    S.lists.unshift({id:listId, name:'Investors — September 2026',
      icp:'Signature Athletics PE Investors', dailyTarget:15, order:0,
      createdAt:Date.now(), archived:false});
  }
  /* index everything already on file so a lead we have history with keeps it */
  const byUrl={}, byKey={};
  S.prospects.forEach(p=>{
    const c=canon(p.url); if(c && !byUrl[c]) byUrl[c]=p;
    const k=(p.name||'').trim().toLowerCase()+'|'+(p.company||'').trim().toLowerCase();
    if(!byKey[k]) byKey[k]=p;
  });
  let added=0, carried=0;
  SEPT2026.forEach(r=>{
    const [name, company, url, note, cd]=r;
    const c=canon(url);
    const prior = (c && byUrl[c]) || byKey[name.trim().toLowerCase()+'|'+(company||'').trim().toLowerCase()] || null;
    if(prior && prior.listId===listId) return;          /* already imported */
    const t = cd ? new Date(cd+'T10:00:00').getTime() : Date.now();
    const p = {id:uid(), listId, name, position:'', company:company||'',
      icp:'Signature Athletics PE Investors', url:url||'',
      status:'NOT_CONNECTED', addedAt:t, updatedAt:t, archived:false, note:note||'',
      history:[{ts:t, user:'Sept 2026 import', from:null, to:'NOT_CONNECTED'}]};
    if(prior){
      /* same person already worked in an earlier project — carry the progress over
         so nobody gets a duplicate connection request */
      p.status = prior.status;
      p.history = (prior.history||[]).concat([{ts:t, user:'Sept 2026 import', from:prior.status, to:prior.status}]);
      const src = listById(prior.listId);
      const tag = 'Previously contacted in ' + (src ? src.name : 'an earlier list');
      p.note = p.note ? (p.note + ' · ' + tag) : tag;
      carried++;
    }
    S.prospects.push(p);
    if(c) byUrl[c]=p;
    byKey[name.trim().toLowerCase()+'|'+(company||'').trim().toLowerCase()]=p;
    added++;
  });
  /* close the two completed projects */
  const closed=[];
  ['investor','community'].forEach(id=>{
    const l=listById(id);
    if(l && !l.archived){ l.archived=true; closed.push(l.name); }
  });
  S.sept2026Applied=true;
  S.activity.unshift({id:uid(), ts:Date.now(), user:'System', action:'import',
    detail:`Imported September 2026 Investor Lead List — ${added} prospects added to "Investors — September 2026"${carried?`, ${carried} with prior outreach history carried over`:''}`});
  if(closed.length){
    S.activity.unshift({id:uid(), ts:Date.now(), user:'System', action:'list',
      detail:`Closed completed ${closed.length>1?'projects':'project'}: ${closed.join(' and ')} — archived and removed from the active dashboard`});
  }
  return true;

/* ---- persistent storage ----
   Primary: SHARED workspace storage (one centralized database — every user of this
   link reads and writes the same records). Falls back to browser localStorage when
   the file is opened outside Claude, then to memory as a last resort. */
let backendType = 'memory';
let relayError = '';   /* why the shared database could not be reached, if it could not */
(function detectBackend(){
  if(RELAY_URL){ backendType='relay'; return; }
  if(SUPA_URL && SUPA_KEY){ backendType='supabase'; return; }
  try{ if(window.storage && window.storage.get && window.storage.set){ backendType='claude'; return; } }catch(e){}
  try{
    const t='__ccopc_test__';
    window.localStorage.setItem(t,'1'); window.localStorage.removeItem(t);
    backendType='local';
  }catch(e){ backendType='memory'; }
})();
memoryOnly = (backendType==='memory');

/* ---- shared database over the worker (one JSON document) ---- */
const relayHeaders = () => RELAY_TOKEN ? {'Content-Type':'application/json','X-Desk-Token':RELAY_TOKEN}
                                       : {'Content-Type':'application/json'};
async function relayLoad(revOnly=false){
  const res = await fetch(RELAY_URL.replace(/\/+$/,'') + '/state' + (revOnly?'?rev=1':''),
    {headers: relayHeaders(), cache:'no-store'});
  if(!res.ok) throw new Error('relay read ' + res.status);
  const j = await res.json();
  if(revOnly) return {rev: j.rev||0};
  return j.data ? Object.assign({}, j.data, {rev: j.rev || j.data.rev || 0}) : null;
}
async function relaySave(state){
  const res = await fetch(RELAY_URL.replace(/\/+$/,'') + '/state',
    {method:'POST', headers: relayHeaders(), body: JSON.stringify({rev: state.rev, data: state})});
  if(!res.ok) throw new Error('relay write ' + res.status);
  const j = await res.json().catch(()=>({}));
  if(j && j.rev) state.rev = j.rev;      /* the worker owns the revision counter */
  if(j && Array.isArray(j.notified) && j.notified.length) recordServerNotices(j.notified);
  return j;
}
/* The server sends the emails, so it is the only thing that knows whether one
   went out. Pull its verdict into the delivery log so a silent failure is
   impossible to miss. */
function recordServerNotices(list){
  try{
    ensureNotify();
    let changed = false;
    list.forEach(n=>{
      const who = n.to || '-';
      if(n.sent){ ntfLog('sent', who, 'email sent by the server'); changed = true; }
      else if(n.skipped){ ntfLog('skipped', who, n.skipped); changed = true; }
      else if(n.error){ ntfLog('failed', who, n.error); changed = true; }
    });
    if(changed && session && view==='integration') render();
  }catch(e){}
}

/* ---- cloud database helpers (Supabase REST, single-row JSON document) ---- */
const supaHeaders = () => ({'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'});
async function supaLoad(revOnly=false){
  const sel = revOnly ? 'rev' : 'rev,data';
  const res = await fetch(SUPA_URL+'/rest/v1/prospect_desk?id=eq.1&select='+sel, {headers:supaHeaders()});
  if(!res.ok) throw new Error('cloud read '+res.status);
  const rows = await res.json();
  if(!rows.length) return null;
  return revOnly ? {rev:rows[0].rev} : rows[0].data;
}
async function supaSave(state){
  const res = await fetch(SUPA_URL+'/rest/v1/prospect_desk', {
    method:'POST',
    headers:{...supaHeaders(),'Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:1, rev:state.rev, data:state, saved_at:new Date().toISOString()}])
  });
  if(!res.ok) throw new Error('cloud write '+res.status);
}

async function persist(){
  /* advance past whatever revision is already in the centralized store so a
     portal that loaded earlier can never tie with or roll back another's save */
  try{
    if(backendType==='relay'){
      const r = await relayLoad(true);
      if(r && (r.rev||0) >= (S.rev||0)){
        S.rev = r.rev;
        try{ reconcileChat(await relayLoad()); }catch(e2){}
      }
    }
    else if(backendType==='supabase'){
      const r = await supaLoad(true);
      if(r && (r.rev||0) >= (S.rev||0)){
        S.rev = r.rev;
        /* somebody else wrote since we loaded — pull their copy and fold any
           chat messages in so this save can't clobber them */
        try{ reconcileChat(await supaLoad()); }catch(e2){}
      }
    }
    else if(backendType==='claude'){ const remote = await readShared(); if(remote){ if((remote.rev||0) >= (S.rev||0)) S.rev = remote.rev; reconcileChat(remote); } }
    else if(backendType==='local'){ reconcileChat(readLocal()); }
  }catch(e){}
  S.rev = (S.rev||0)+1;
  S.savedAt = Date.now();
  S.savedBy = session ? session.name : 'System';
  const json = JSON.stringify(S);
  try{
    if(backendType==='relay'){ await relaySave(S); try{window.localStorage.setItem(KEY,JSON.stringify(S));}catch(e2){} }
    else if(backendType==='supabase'){ await supaSave(S); try{window.localStorage.setItem(KEY,json);}catch(e2){} }
    else if(backendType==='claude'){ await window.storage.set(KEY, json, true); } /* shared=true → centralized */
    else if(backendType==='local'){ window.localStorage.setItem(KEY, json); }
    cloudDown=false;
    updateSyncStat();
  }catch(e){
    if(backendType==='relay' || backendType==='supabase'){
      /* relay temporarily unreachable — keep the change locally; polling re-pushes automatically */
      cloudDown=true; pendingPush=true;
      try{ window.localStorage.setItem(KEY, json); }catch(e2){}
      updateSyncStat();
      toast('⚠ Cloud unreachable — change saved locally, will re-sync automatically');
    } else if(backendType==='claude'){
      try{ window.localStorage.setItem(KEY, json); backendType='local'; updateSyncStat(); }
      catch(e2){ backendType='memory'; memoryOnly=true; toast('⚠ Storage unavailable — changes will be lost on refresh'); }
    } else { backendType='memory'; memoryOnly=true; toast('⚠ Storage unavailable — changes will be lost on refresh'); }
  }
}
let cloudDown=false, pendingPush=false;
function readLocal(){
  try{ const v = window.localStorage.getItem(KEY); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
async function readShared(){
  try{ const r = await window.storage.get(KEY, true); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  return null;
}
async function readLegacyPersonal(){
  try{ const r = await window.storage.get(KEY); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  return null;
}
async function loadState(){
  try{
    if(backendType==='relay'){
      /* the worker is the source of truth; carry a newer local copy up on first run */
      const remote = await relayLoad();
      const local = readLocal();
      if(remote && local) return ((local.rev||0) > (remote.rev||0)) ? local : remote;
      return remote || local;
    } else if(backendType==='supabase'){
      /* cloud row is the source of truth; migrate a newer local copy forward
         (e.g. first run after enabling the cloud on the device that has the data) */
      const remote = await supaLoad();
      const local = readLocal();
      if(remote && local) return ((local.rev||0) > (remote.rev||0)) ? local : remote;
      return remote || local;
    } else if(backendType==='claude'){
      /* centralized copy first; migrate any older personal copy forward */
      const shared = await readShared();
      const legacy = await readLegacyPersonal();
      if(shared && legacy) return ((legacy.rev||0) > (shared.rev||0)) ? legacy : shared;
      return shared || legacy;
    } else if(backendType==='local'){
      const v = window.localStorage.getItem(KEY);
      if(v) return JSON.parse(v);
    }
  }catch(e){ /* first run or unreadable */ }
  return null;
}

/* ---- live sync: poll the centralized store and adopt any newer revision ---- */
let lastSyncAt = null;
function typingNow(){
  const a=document.activeElement;
  /* the chat composer keeps its draft in chatDraft, so a sync can safely land
     underneath it — everything else still blocks the swap */
  if(a && a.id==='chatInput') return false;
  return a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');
}
async function refreshFromStorage(){
  if(backendType==='memory') return;
  try{
    /* recover from a cloud outage: re-push the locally held change first */
    if(backendType==='relay' && pendingPush && S){
      await relaySave(S); pendingPush=false; cloudDown=false;
      toast('Back online — your changes were saved');
    }
    if(backendType==='supabase' && pendingPush && S){
      await supaSave(S); pendingPush=false; cloudDown=false;
      toast('Cloud back online — your changes were synced');
    }
    let fresh=null;
    if(backendType==='relay'){
      const head = await relayLoad(true);
      cloudDown=false;
      if(head && S && (head.rev||0) > (S.rev||0)) fresh = await relayLoad();
    } else if(backendType==='supabase'){
      const head = await supaLoad(true);           /* cheap revision-only check */
      cloudDown=false;
      if(head && S && (head.rev||0) > (S.rev||0)) fresh = await supaLoad();
    } else if(backendType==='claude'){ fresh = await readShared(); }
    else { fresh = readLocal(); }
    lastSyncAt = Date.now();
    updateSyncStat();
    flushNotices();
    if(fresh && S){
      const me = myPortal();
      const seenTs = chatMsgs().filter(m=>m.from!==me).reduce((a,m)=>Math.max(a,m.ts),0);
      const newer = (fresh.rev||0) > (S.rev||0);
      /* don't yank the UI out from under an open form or active typing — retry on next poll */
      const busy = document.getElementById('overlay').classList.contains('on') || typingNow();
      let touched = false;
      if(newer && !busy){
        const localThread = {messages: chatMsgs().slice(), chatRead: Object.assign({}, S.chatRead||{})};
        S = fresh;
        ensureChat();
        /* fold anything we sent that this copy never saw back in, then republish it */
        const r = reconcileChat(localThread);
        if(r.gained) persist();
        if(session) render();
        touched = true;
        if(session && !chatOpen) toast('Synced — latest updates from ' + esc(fresh.savedBy||'the team') + ' loaded');
      } else {
        /* same or older revision, or the UI is busy — still reconcile the thread so a
           simultaneous send on both sides can never disappear */
        const r = reconcileChat(fresh);
        if(r.ahead && (r.gained || !newer)) persist();
        if(r.gained){ if(session) renderChat(); touched = true; }
      }
      if(touched && session){
        const incoming = chatMsgs().filter(m=>m.from!==me && !m.deleted && m.ts>seenTs);
        if(incoming.length){
          if(chatOpen){ markChatRead(); renderChat(); }
          else{
            const last = incoming[incoming.length-1];
            const body = (last.text||'').slice(0,58);
            toast(`<b>${esc(last.name||CHAT_NAME[last.from]||'New message')}</b> — ${esc(body)}${(last.text||'').length>58?'…':''}`);
          }
        }
      }
    }
  }catch(e){
    if(backendType==='relay' || backendType==='supabase'){ cloudDown=true; updateSyncStat(); }
    /* transient failure — next poll retries automatically */
  }
}
function updateSyncStat(){
  const el=document.getElementById('syncStat'); if(!el) return;
  const t = lastSyncAt||S&&S.savedAt;
  const stamp = t?' · checked '+new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}):'';
  el.innerHTML = backendType==='relay'
    ? (cloudDown
      ? `<span style="color:#E8A13C">●</span> Shared database offline — retrying`
      : `<span style="color:#4CAF7D">●</span> Shared database · live${stamp}`)
    : backendType==='supabase'
    ? (cloudDown
      ? `<span style="color:#E8A13C">●</span> Cloud offline — retrying automatically`
      : `<span style="color:#4CAF7D">●</span> Cloud database · live${stamp}`)
    : backendType==='claude'
    ? `<span style="color:var(--gold)">●</span> Shared database${stamp}`
    : backendType==='local'
    ? `<span style="color:#E8A13C">●</span> This-device storage only — cloud setup available`
    : `<span style="color:#D06">●</span> Memory only — not saved`;
}
window.addEventListener('storage', e=>{ if(e.key===KEY) refreshFromStorage(); });
/* Poll quickly while someone is actually looking at the desk, slowly when the tab
   is in the background. A desk left open all day would otherwise spend the shared
   database's monthly allowance on checks nobody is reading. */
const POLL_ACTIVE = 5000, POLL_IDLE = 30000;
let pollTimer = null;
const pollDelay = () => document.visibilityState === 'hidden' ? POLL_IDLE : POLL_ACTIVE;
function schedulePoll(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(function(){
    Promise.resolve(refreshFromStorage()).catch(()=>{}).then(schedulePoll);
  }, pollDelay());
}
schedulePoll();
window.addEventListener('focus', ()=>{ refreshFromStorage(); schedulePoll(); });
document.addEventListener('visibilitychange', ()=>{
  /* coming back to the tab: catch up at once, then return to the fast rhythm */
  if(document.visibilityState==='visible') refreshFromStorage();
  schedulePoll();
});

  for(let i=13;i>=0;i--){ const d=new Date(nowD); d.setDate(d.getDate()-i); days.push(dayKey(d.getTime())); }
  const addsByDay = days.map(k=>all.filter(p=>dayKey(p.addedAt)===k).length);
  const maxAdd = Math.max(...addsByDay,1);
  const before14 = all.filter(p=>dayKey(p.addedAt) < days[0]).length;
  const growth14 = all.length - before14;
  const connectedNow = all.filter(p=>['CONNECTED','RESPONDED','FOLLOW_UP'].includes(p.status)).length;
  const bw=44, gap=6, ch=120, cw=days.length*(bw+gap)-gap;
  const bars = addsByDay.map((v,i)=>{
    const h=Math.max(v/maxAdd*(ch-30),v?4:2), x=i*(bw+gap);
    const lbl=new Date(days[i]+'T12:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'});
    return `<g><rect x="${x}" y="${ch-18-h}" width="${bw}" height="${h}" rx="4" fill="${v?'url(#gGold)':'var(--gray-soft)'}"/>
      ${v?`<text x="${x+bw/2}" y="${ch-24-h}" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="12" fill="var(--ink)">${v}</text>`:''}
      <text x="${x+bw/2}" y="${ch-4}" text-anchor="middle" font-family="Inter" font-size="9.5" fill="var(--muted)">${lbl}</text></g>`;
  }).join('');
  const growthChart=`<svg viewBox="0 0 ${cw} ${ch}" style="width:100%;max-width:${cw}px;height:auto;display:block" role="img" aria-label="Prospects added per day, last 14 days">
    <defs><linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--gold-deep)"/></linearGradient></defs>${bars}</svg>`;

  return `
  <div class="page-head">
    <div><div class="eyebrow">Monitoring · ${dateStr}</div>
      <h1>${greet}, ${esc(session.name.split(' ')[0])}</h1>
      <div class="sub">Live view of every prospect list for Dan Soviero's investor outreach.</div></div>
    <div class="head-actions">
      <button class="btn btn-ghost btn-sm" data-digest>Today's snapshot</button>
      ${can('lists')?`<button class="btn btn-dark btn-sm" data-nav="newlist">＋ New list</button>`:''}</div>
  </div>
  ${session.portal==='client'?(()=>{const d=todayDigest();return `
  <div class="card" style="display:flex;align-items:center;gap:18px;padding:15px 20px;margin-bottom:20px;border-left:4px solid var(--gold);flex-wrap:wrap">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" style="flex:none"><path d="M9 2a4.5 4.5 0 00-4.5 4.5c0 3-1.3 4-1.3 4h11.6s-1.3-1-1.3-4A4.5 4.5 0 009 2zM7.5 13.5a1.5 1.5 0 003 0" stroke="var(--gold-deep)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="flex:1;min-width:220px;font-size:13px"><b style="color:var(--ink)">Today so far:</b>
      <b style="color:var(--gold-deep)">${d.added}</b> added ·
      <b style="color:var(--amber)">${d.sent}</b> request${d.sent===1?'':'s'} sent ·
      <b style="color:var(--green)">${d.connected}</b> connected${d.responded?` · <b style="color:var(--blue)">${d.responded}</b> responded`:''}</div>
    <button class="btn btn-ghost btn-sm" data-digest>Details</button>
  </div>`})():''}
  <div class="kpis">
    <div class="card kpi"><div class="k-label">Total prospects</div><div class="k-val">${all.length}</div><div class="k-note">across ${activeLists().length} active lists</div></div>
    <div class="card kpi"><div class="k-label">Requests pending</div><div class="k-val">${c.REQUEST_SENT}</div><div class="k-note">awaiting acceptance</div></div>
    <div class="card kpi"><div class="k-label">Connected</div><div class="k-val">${c.CONNECTED + c.RESPONDED + c.FOLLOW_UP}</div><div class="k-note">${c.RESPONDED} responded</div></div>
    <div class="card kpi"><div class="k-label">Follow-ups due</div><div class="k-val">${c.FOLLOW_UP}</div><div class="k-note">need attention</div></div>
    <div class="card kpi"><div class="k-label">Response rate</div><div class="k-val">${respRate}%</div><div class="k-note">of contacted prospects</div></div>
  </div>
  <div class="sec-title">Daily targets — 15 qualified prospects per list</div>
  <div class="list-cards">${cards || '<div class="card empty"><b>No lists yet</b>Create your first prospect list to begin.</div>'}</div>
  <div class="sec-title">Network growth — last 14 days</div>
  <div class="card" style="padding:20px 22px">
    <div style="display:flex;gap:26px;flex-wrap:wrap;margin-bottom:14px">
      <div><div class="k-label">Network size</div><div class="k-val" style="font-size:24px">${all.length}</div></div>

/* ================= LIST VIEW ================= */
function renderList(listId){
  const l = listById(listId);
  if(!l) { view='dashboard'; return renderDashboard(); }
  const f = filters[listId] || (filters[listId] = {q:'',status:'',icp:'',from:'',to:'',arch:false});
  const today = countToday(listId), week = countWeek(listId);
  const remaining = Math.max(l.dailyTarget - today, 0);
  const total = listProspects(listId).length;
  const icps = [...new Set(S.prospects.filter(p=>p.listId===listId).map(p=>p.icp).filter(Boolean))].sort();

  let rows = S.prospects.filter(p=>p.listId===listId && (f.arch ? true : !p.archived));
  if(f.q){ const q=f.q.toLowerCase(); rows = rows.filter(p=>(p.name+' '+p.company+' '+p.position).toLowerCase().includes(q)); }
  if(f.status) rows = rows.filter(p=>p.status===f.status);
  if(f.icp) rows = rows.filter(p=>p.icp===f.icp);
  if(f.from) rows = rows.filter(p=>dayKey(p.addedAt) >= f.from);
  if(f.to) rows = rows.filter(p=>dayKey(p.addedAt) <= f.to);
  rows.sort((a,b)=>b.addedAt-a.addedAt);

  const PER=50;
  const pages=Math.max(1, Math.ceil(rows.length/PER));
  f.pg=Math.min(Math.max(f.pg||1,1), pages);
  const pageRows=rows.slice((f.pg-1)*PER, f.pg*PER);

  const canStatus = can('status'), canEdit = can('edit'), canDel = can('delete');
  const trs = pageRows.map(p=>`
    <tr>
      <td><span class="p-name">${esc(p.name)}${p.archived?'<span class="badge-arch">Archived</span>':''}</span>
          ${p.position?`<span class="p-pos" title="${esc(p.position)}">${esc(p.position)}</span>`:''}
          ${p.context?`<span class="p-ctx" title="${esc(p.context)}">${esc(p.context)}</span>`:''}</td>
      <td>${esc(p.company)||'<span style="color:var(--muted)">—</span>'}</td>
      <td style="font-size:12px;color:var(--muted)">${esc(p.icp)}</td>
      <td style="white-space:nowrap">${p.url
          ?`<a class="link-btn" href="${esc(p.url)}" target="_blank" rel="noopener">Profile ↗</a>`
          :`<a class="link-btn" style="color:var(--muted)" href="${esc(findLink(p))}" target="_blank" rel="noopener" title="Search Google for this person's LinkedIn profile, then paste the URL via Edit">Find ↗</a>`}
</td>
      <td>${canStatus
        ? `<select class="st-select st-${p.status}" data-status-for="${p.id}" aria-label="Status for ${esc(p.name)}">${Object.keys(STATUSES).map(k=>`<option value="${k}" ${k===p.status?'selected':''}>${STATUSES[k]}</option>`).join('')}</select>`
        : `<span class="pill st-${p.status}">${STATUSES[p.status]}</span>`}</td>
      <td>${noteCell(p, canEdit)}</td>
      <td style="white-space:nowrap;font-size:12px;color:var(--muted)" title="Updated ${fmtDT(p.updatedAt)}">${fmtDate(p.addedAt)}</td>
      <td><div class="row-actions">
        ${canEdit?`<button class="icon-btn" data-edit="${p.id}" title="Edit"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M9.2 1.8l2 2L4.6 10.4l-2.6.6.6-2.6 6.6-6.6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg></button>`:''}
        ${can('archive')?`<button class="icon-btn" data-archive="${p.id}" title="${p.archived?'Restore':'Archive'}"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><rect x="1.5" y="2" width="10" height="2.6" rx=".8" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 4.6V10a1 1 0 001 1h6a1 1 0 001-1V4.6M5.2 7h2.6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>`:''}
        ${canDel?`<button class="icon-btn danger" data-del="${p.id}" title="Delete"><svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 3.5h8M5 3.5V2.3a.8.8 0 01.8-.8h1.4a.8.8 0 01.8.8v1.2M4 3.5l.5 7a1 1 0 001 .9h2a1 1 0 001-.9l.5-7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></button>`:''}
      </div></td>
    </tr>`).join('');

  return `
  <div class="page-head">
    <div><div class="eyebrow">${esc(l.icp)}</div><h1>${esc(l.name)}</h1>
      <div class="sub">${total} prospects · target ${l.dailyTarget} qualified adds per day</div></div>
    <div class="head-actions">
      ${can('add')?`<button class="btn btn-gold btn-sm" style="width:auto" data-addto="${l.id}">＋ Add prospect</button>`:''}
      ${can('edit')?`<button class="btn btn-ghost btn-sm" data-notetpl="1">Default note</button>`:''}
      ${can('lists')?`<button class="btn btn-ghost btn-sm" data-editlist="${l.id}">List settings</button>`:''}
    </div>
  </div>
  <div class="target-strip">
    <div class="card ts-card">${ring(today, l.dailyTarget, 58)}
      <div><div class="t-lab">Added today</div><div class="t-num">${today} <span style="font-size:13px;color:var(--muted);font-weight:600">/ ${l.dailyTarget}</span></div>
      <div class="t-sub">${remaining===0?'Daily target reached ✓':remaining+' remaining today'}</div></div></div>
    <div class="card ts-card"><div style="flex:1"><div class="t-lab">This week</div><div class="t-num">${week} <span style="font-size:13px;color:var(--muted);font-weight:600">/ ${l.dailyTarget*5}</span></div>
      <div class="bar" style="margin-top:7px"><i style="width:${Math.min(week/(l.dailyTarget*5)*100,100)}%"></i></div></div></div>
    <div class="card ts-card"><div><div class="t-lab">All time</div><div class="t-num">${total}</div><div class="t-sub">since ${fmtDate(l.createdAt)}</div></div></div>
  </div>
  <div class="toolbar">
    <input type="text" placeholder="Search name, company, position…" value="${esc(f.q)}" data-f="q" aria-label="Search prospects">
    <select data-f="status" aria-label="Filter by status"><option value="">All statuses</option>${Object.keys(STATUSES).map(k=>`<option value="${k}" ${f.status===k?'selected':''}>${STATUSES[k]}</option>`).join('')}</select>
    <select data-f="icp" aria-label="Filter by ICP"><option value="">All ICPs</option>${icps.map(i=>`<option ${f.icp===i?'selected':''}>${esc(i)}</option>`).join('')}</select>
    <input type="date" value="${f.from}" data-f="from" aria-label="Added from" title="Added from">
    <input type="date" value="${f.to}" data-f="to" aria-label="Added to" title="Added to">
    <label style="font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-left:2px"><input type="checkbox" data-f="arch" ${f.arch?'checked':''}> Show archived</label>
  </div>
  <div class="card tbl-wrap">
    <table><thead><tr><th>Prospect</th><th>Company</th><th>ICP</th><th>LinkedIn</th><th>Status</th><th>Notes</th><th>Added</th><th></th></tr></thead>
    <tbody>${trs || `<tr><td colspan="8"><div class="empty"><b>No prospects match</b>Adjust your search or filters${can('add')?', or add a new prospect':''}.</div></td></tr>`}</tbody></table>
  </div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap">
    <div class="count-note" style="margin:0">Showing ${rows.length?((f.pg-1)*PER+1)+'–'+Math.min(f.pg*PER,rows.length):'0'} of ${rows.length} matching · ${total} total in list</div>
    ${pages>1?`<div style="display:flex;gap:6px;align-items:center">
      <button class="btn btn-ghost btn-sm" data-pg="prev" ${f.pg<=1?'disabled':''}>‹ Prev</button>
      <span style="font-size:12.5px;color:var(--muted)">Page ${f.pg} / ${pages}</span>
      <button class="btn btn-ghost btn-sm" data-pg="next" ${f.pg>=pages?'disabled':''}>Next ›</button></div>`:''}
  </div>
  <div class="count-note">“Find ↗” opens a LinkedIn profile search for prospects without a saved link — paste the URL via Edit and it becomes “Profile ↗”. In the Notes column the copy icon copies that lead’s full note, ready to paste into LinkedIn; the pencil edits it. A note the VA edits is tagged <b>Custom</b> and is never touched by a later default-note rollout.</div>`;
}

  <div class="card int-card" style="margin-top:18px">

      : 'Every new chat message is handed to your relay, which sends the email. The relay holds the mail credentials and its own copy of the recipient list, so nothing sensitive sits in this file.'}
    Alerts are skipped while the other person already has the chat open, and at most one is sent
    per ${esc(String(n.quietSeconds||60))} seconds — it carries everything they have not read yet.</p>
    ${RELAY_URL?`<div class="note-prev" style="margin-top:0"><b>Backend</b>${esc(RELAY_URL)} ${backendType==='relay'?'· connected':'· <span style="color:var(--red)">not responding</span>'}</div>`:''}
    <div class="ntf-grid">
      ${RELAY_URL?'':`<div class="ntf-f"><label>Relay URL</label>
        <input id="ntfUrl" type="url" placeholder="https://prospect-desk.yourname.workers.dev" value="${esc(n.url||'')}"></div>
      <div class="ntf-f"><label>Shared token (optional)</label>
        <input id="ntfToken" type="text" placeholder="matches DESK_TOKEN in the worker" value="${esc(n.token||'')}"></div>`}
      <div class="ntf-f"><label>Address of this app</label>
        <input id="ntfApp" type="url" placeholder="https://prospects.crosscore.com/" value="${esc(n.appUrl||'')}"></div>
      <div class="ntf-f"><label>Email ${esc(R.team.name||'the VA')} at</label>
        <input id="ntfTeamEmail" type="email" value="${esc(R.team.email||'')}" ${RELAY_URL?'disabled title="Set by the EMAIL_TEAM environment variable"':''}></div>
      <div class="ntf-f"><label>Email ${esc(R.client.name||'the client')} at</label>
        <input id="ntfClientEmail" type="email" value="${esc(R.client.email||'')}" ${RELAY_URL?'disabled title="Set by the EMAIL_CLIENT environment variable"':''}></div>
    </div>
    <div class="ntf-row">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px">
        <input type="checkbox" id="ntfOn" ${n.enabled?'checked':''}> <b>Send notifications</b></label>
      <button class="btn btn-gold btn-sm" id="ntfSave" style="width:auto;margin-left:auto">Save</button>
      <button class="btn btn-sm" id="ntfTest" style="width:auto">Send test</button>
    </div>
    ${!n.appUrl?`<p style="font-size:12.5px;color:var(--amber);margin-top:10px">Add the address this app is hosted at, otherwise the emails arrive without a link back to the conversation.</p>`:''}
    ${queued?`<p style="font-size:12.5px;color:var(--amber);margin-top:10px">${queued} alert${queued===1?'':'s'} waiting to retry — the relay was unreachable.</p>`:''}
    ${rows?`<div class="ntf-log"><div style="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px">Recent delivery attempts</div>
      <table>${rows}</table></div>`:''}

function copyNote(p){
  const note = leadNote(p);
  if(!note){ toast('This lead has no note yet'); return; }
  const done = ()=> toast(`Copied: <b>${esc(note.length>52?note.slice(0,52)+'…':note)}</b>`);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(note).then(done).catch(()=>{ fallbackCopy(note); done(); });
  } else { fallbackCopy(note); done(); }
}

  const sample = S.prospects.find(p=>!p.archived && isActiveListId(p.listId)) || {name:'Alex Reyes', company:'Bluestem Equity', position:'Partner'};

      </div>`);
  }

  const rows = (S.noteTemplates||[]).slice().sort((a,b)=>(b.activatedAt||b.createdAt)-(a.activatedAt||a.createdAt)).map(t=>`
    <div class="tpl-row ${t.id===S.activeNoteId?'on':''}">

  openModal(`

  <div class="modal-body">
    <p style="font-size:13px;color:var(--muted);margin-bottom:12px">The note every lead starts with. Write it once — the tokens fill in each lead's own details when the note is copied.</p>
    <div class="field"><label>Note text</label>
      <textarea id="tplText" rows="3" placeholder="Hey {first}! Would love to connect.">${esc(draft)}</textarea></div>
    <div style="margin-top:8px">${NOTE_TOKENS.map(k=>`<span class="tok" data-tok="${esc(k.t)}" title="Insert ${esc(k.d)}">${esc(k.t)}</span>`).join('')}
      <span style="font-size:11.5px;color:var(--muted)">click to insert</span></div>
    <div class="note-prev"><b>Preview · ${esc(sample.name)}</b><span id="tplPrev">${esc(resolveNote(draft, sample))}</span></div>
    <div id="tplGap">${gapWarning(draft)}</div>
    <p style="font-size:12.5px;color:var(--muted);margin-top:10px">Right now <b>${c.update}</b> of ${c.total} leads follow the default; <b>${c.custom}</b> have a custom note and will be left alone.</p>
    ${rows?`<div class="tpl-list">${rows}</div>`:''}
  </div>
  <div class="modal-foot">

  const ta = document.getElementById('tplText');
  const sync = ()=>{ tplDraft = ta.value;
    const el=document.getElementById('tplPrev'); if(el) el.textContent = resolveNote(ta.value, sample);

  ta.addEventListener('input', sync);
  document.querySelectorAll('[data-tok]').forEach(b=>b.addEventListener('click', ()=>{
    const s=ta.selectionStart||0, e=ta.selectionEnd||0;
    ta.value = ta.value.slice(0,s) + b.dataset.tok + ta.value.slice(e);

/* ================= ACTIONS ================= */
function findDuplicate(url, name, excludeId){
  const c = canon(url);
  return S.prospects.find(p=>{
    if(p.id===excludeId || p.archived) return false;
    if(c && canon(p.url)===c) return true;
    if(!c && p.name.trim().toLowerCase()===name.trim().toLowerCase()) return true;
    return false;
  });
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-nav],[data-open-list],[data-addto],[data-edit],[data-archive],[data-del],[data-editlist],[data-close],[data-digest],[data-copynote],[data-pg],[data-editnote],[data-savenote],[data-cancelnote],[data-resetnote],[data-notetpl],[data-tplsave],[data-tplapply],[data-tplback],[data-tpluse],[data-tpledit],[data-tpldel],#pSave,#lSave,#lArchive');
  if(!t) return;

  if(t.dataset.digest!==undefined){ digestModal(); return; }

  if(t.dataset.copynote){
    const p=S.prospects.find(x=>x.id===t.dataset.copynote); if(p) copyNote(p);
    return;
  }
  if(t.dataset.editnote){ editingNote = t.dataset.editnote; render();
    const ta=document.getElementById('noteEd'); if(ta){ ta.focus(); ta.selectionStart=ta.value.length; } return; }
  if(t.dataset.cancelnote){ editingNote=null; render(); return; }
  if(t.dataset.savenote){
    const p=S.prospects.find(x=>x.id===t.dataset.savenote); if(!p) return;
    const ta=document.getElementById('noteEd'); if(!ta) return;
    const val=ta.value.trim();
    const wasDefault = resolveNote(activeTplText(), p);
    p.note = val;
    p.noteCustom = (val !== wasDefault);      /* typing the default back is not a customisation */
    p.updatedAt = Date.now();
    addActivity('edit', `Note updated for ${p.name}${p.noteCustom?' (custom)':''}`);
    editingNote=null; persist(); render(); toast(`Note saved for <b>${esc(p.name)}</b>`); return;
  }
  if(t.dataset.resetnote){
    const p=S.prospects.find(x=>x.id===t.dataset.resetnote); if(!p) return;
    p.noteCustom=false; p.note=resolveNote(activeTplText(), p); p.updatedAt=Date.now();
    addActivity('edit', `Note for ${p.name} reset to the default`);
    editingNote=null; persist(); render(); toast(`<b>${esc(p.name)}</b> follows the default note again`); return;
  }
  if(t.dataset.notetpl){ tplDraft=null; tplConfirm=null; noteTemplateModal(); return; }
  if(t.dataset.tpledit){
    const tpl=(S.noteTemplates||[]).find(x=>x.id===t.dataset.tpledit);
    if(tpl){ tplDraft=tpl.text; tplConfirm=null; noteTemplateModal(); } return;
  }
  if(t.dataset.tpldel){
    S.noteTemplates=(S.noteTemplates||[]).filter(x=>x.id!==t.dataset.tpldel);
    persist(); noteTemplateModal(); toast('Note removed'); return;
  }
  if(t.dataset.tpluse){
    const tpl=(S.noteTemplates||[]).find(x=>x.id===t.dataset.tpluse);
    if(tpl){ tplConfirm={text:tpl.text, id:tpl.id}; noteTemplateModal(); } return;
  }
  if(t.dataset.tplsave){
    const ta=document.getElementById('tplText'); if(!ta) return;
    const text=ta.value.trim();
    if(!text){ toast('Write the note first'); return; }
    tplConfirm={text, id:null}; noteTemplateModal(); return;
  }
  if(t.dataset.tplback){ tplConfirm=null; noteTemplateModal(); return; }
  if(t.dataset.tplapply){
    if(!tplConfirm) return;
    let id=tplConfirm.id;
    if(id){ const tpl=(S.noteTemplates||[]).find(x=>x.id===id); if(tpl) tpl.text=tplConfirm.text; }
    else{
      const same=(S.noteTemplates||[]).find(x=>x.text===tplConfirm.text);
      if(same){ id=same.id; }
      else{ id=uid(); S.noteTemplates.unshift({id, text:tplConfirm.text, createdAt:Date.now(), activatedAt:null,
        createdBy:session?session.name:'System'}); }
    }
    const n=applyDefaultNote(id, false);
    addActivity('edit', `Default note activated — "${tplConfirm.text}" applied to ${n} lead${n===1?'':'s'}`);
    tplConfirm=null; tplDraft=null;
    persist(); closeModal(); render();
    toast(`Default note applied to <b>${n}</b> lead${n===1?'':'s'}`); return;
  }

  if(t.dataset.pg && view.startsWith('list:')){
    const lf=filters[view.slice(5)];
    lf.pg=(lf.pg||1)+(t.dataset.pg==='next'?1:-1);
    render(); window.scrollTo(0,0); return;
  }

  if(t.dataset.close!==undefined){ closeModal(); return; }

  if(t.dataset.nav){
    if(t.dataset.nav==='newlist'){ if(can('lists')) listModal(null); return; }
    view = t.dataset.nav; render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.openList){ view='list:'+t.dataset.openList; render(); window.scrollTo(0,0); return; }
  if(t.dataset.addto){ prospectModal(t.dataset.addto, null); return; }
  if(t.dataset.edit){ const p=S.prospects.find(x=>x.id===t.dataset.edit); if(p) prospectModal(p.listId, p); return; }
  if(t.dataset.editlist){ listModal(listById(t.dataset.editlist)); return; }

  if(t.dataset.archive){
    const p=S.prospects.find(x=>x.id===t.dataset.archive); if(!p) return;
    p.archived=!p.archived; p.updatedAt=Date.now();
    addActivity('archive', `${p.archived?'Archived':'Restored'} ${p.name} in ${listById(p.listId).name}`);
    persist(); render(); toast(p.archived?`<b>${esc(p.name)}</b> archived`:`<b>${esc(p.name)}</b> restored`); return;
  }
  if(t.dataset.del){
    const p=S.prospects.find(x=>x.id===t.dataset.del); if(!p) return;
    if(!confirm(`Permanently delete ${p.name}? This cannot be undone.`)) return;
    S.prospects = S.prospects.filter(x=>x.id!==p.id);
    addActivity('delete', `Deleted ${p.name} from ${listById(p.listId).name}`);
    persist(); render(); toast(`<b>${esc(p.name)}</b> deleted`); return;
  }

  if(t.id==='pSave'){
    const err=document.getElementById('pErr');
    const name=document.getElementById('pName').value.trim();
    const icp=document.getElementById('pIcp').value.trim();
    const url=document.getElementById('pUrl').value.trim();
    if(!name||!icp){ err.textContent='Name and ICP category are required.'; err.style.display='block'; return; }
    if(url && !/^https?:\/\/([a-z]+\.)?linkedin\.com\//i.test(url)){ err.textContent='LinkedIn URL should start with https://www.linkedin.com/…'; err.style.display='block'; return; }
    const pid=t.dataset.pid, listId=t.dataset.list;
    const dup=findDuplicate(url,name,pid||null);
    if(dup){ err.textContent=`Duplicate blocked — ${dup.name} already exists in "${listById(dup.listId).name}".`; err.style.display='block'; return; }
    const vals={name, icp, url, position:document.getElementById('pPos').value.trim(),
      company:document.getElementById('pComp').value.trim(), status:document.getElementById('pStatus').value,
      note:document.getElementById('pNote').value.trim()};
    /* blank, or identical to the default, means "follow the default" */
    const noteFor = o => resolveNote(activeTplText(), o);
    vals.noteCustom = !!vals.note && vals.note !== noteFor(vals);
    if(!vals.note) vals.note = noteFor(vals);
    if(pid){
      const p=S.prospects.find(x=>x.id===pid);
      const stChanged=p.status!==vals.status;
      if(stChanged) p.history.push({ts:Date.now(),user:session.name,from:p.status,to:vals.status});
      Object.assign(p, vals, {updatedAt:Date.now()});
      addActivity(stChanged?'status':'edit', stChanged
        ? `${p.name}: status → ${STATUSES[vals.status]}`
        : `Updated details for ${p.name} in ${listById(listId).name}`);
      toast(`<b>${esc(p.name)}</b> updated`);
    } else {
      const now=Date.now();
      S.prospects.push({id:uid(), listId, ...vals, addedAt:now, updatedAt:now, archived:false,
        history:[{ts:now,user:session.name,from:null,to:vals.status}]});
      addActivity('add', `Added ${vals.name} to ${listById(listId).name}`);
      const l=listById(listId), today=countToday(listId);
      toast(today>=l.dailyTarget ? `<b>${esc(vals.name)}</b> added — daily target of ${l.dailyTarget} reached 🎉`
        : `<b>${esc(vals.name)}</b> added — ${l.dailyTarget-today} to go today`);
    }
    persist(); closeModal(); render(); return;
  }

  if(t.id==='lSave'){
    const err=document.getElementById('lErr');
    const name=document.getElementById('lName').value.trim();
    const icp=document.getElementById('lIcp').value.trim();
    const target=Math.max(1, parseInt(document.getElementById('lTarget').value)||15);
    if(!name||!icp){ err.textContent='List name and ICP category are required.'; err.style.display='block'; return; }
    const lid=t.dataset.lid;
    if(lid){ const l=listById(lid); Object.assign(l,{name,icp,dailyTarget:target});
      addActivity('list', `Updated list settings for ${name}`); }
    else { const id=uid(); S.lists.push({id,name,icp,dailyTarget:target,createdAt:Date.now(),archived:false});
      addActivity('list', `Created list ${name}`); view='list:'+id; }
    persist(); closeModal(); render(); toast(`List <b>${esc(name)}</b> saved`); return;
  }

  if(t.id==='lArchive'){
    const l=listById(t.dataset.lid); l.archived=!l.archived;
    addActivity('list', `${l.archived?'Archived':'Restored'} list ${l.name}`);
    if(l.archived) view='dashboard';
    persist(); closeModal(); render(); toast(`List <b>${esc(l.name)}</b> ${l.archived?'archived':'restored'}`); return;
  }
});
